<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>B-Corp Quest - Driessen Groep</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #0a1628;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
#ui-layer {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 10;
}
#ui-layer > * { pointer-events: auto; }

/* Mobile Controls */
#mobile-controls {
  display: none;
  position: absolute;
  bottom: 10px;
  left: 0; right: 0;
  padding: 0 15px;
  z-index: 20;
}
.ctrl-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  width: 100%;
}
.ctrl-btn {
  width: 64px; height: 64px;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.15);
  color: #fff;
  font-size: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  transition: background 0.1s;
}
.ctrl-btn:active, .ctrl-btn.active {
  background: rgba(255,255,255,0.4);
}
.ctrl-left-group { display: flex; gap: 12px; }
.ctrl-right-group { display: flex; gap: 12px; }
#btn-jump { width: 80px; height: 80px; font-size: 32px; }

/* Screens */
.screen {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 30;
  transition: opacity 0.4s;
}
.screen.hidden { display: none; }

#start-screen {
  background: linear-gradient(135deg, #003366 0%, #005a9e 40%, #e87722 100%);
}
.logo-area {
  text-align: center;
  margin-bottom: 30px;
}
.logo-area h1 {
  font-size: 2.4em;
  color: #fff;
  text-shadow: 2px 2px 8px rgba(0,0,0,0.4);
  line-height: 1.2;
}
.logo-area h2 {
  font-size: 1.1em;
  color: rgba(255,255,255,0.85);
  font-weight: 400;
  margin-top: 8px;
}
.logo-bcorp {
  font-size: 4em;
  margin-bottom: 10px;
}
.start-btn, .menu-btn {
  padding: 16px 48px;
  font-size: 1.2em;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  font-weight: 700;
  margin: 8px;
  transition: transform 0.15s, box-shadow 0.15s;
}
.start-btn {
  background: #e87722;
  color: #fff;
  box-shadow: 0 4px 15px rgba(232,119,34,0.5);
}
.start-btn:hover, .start-btn:active {
  transform: scale(1.05);
  box-shadow: 0 6px 20px rgba(232,119,34,0.7);
}
.menu-btn {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border: 2px solid rgba(255,255,255,0.4);
  padding: 12px 36px;
  font-size: 1em;
}

/* Level Select */
#level-screen {
  background: linear-gradient(135deg, #003366 0%, #00498f 100%);
}
.level-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  padding: 20px;
  max-width: 400px;
  width: 100%;
}
.level-card {
  background: rgba(255,255,255,0.1);
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 16px;
  padding: 20px 16px;
  text-align: center;
  color: #fff;
  cursor: pointer;
  transition: transform 0.15s, background 0.15s;
}
.level-card:hover, .level-card:active {
  transform: scale(1.03);
  background: rgba(255,255,255,0.2);
}
.level-card.locked {
  opacity: 0.4;
  pointer-events: none;
}
.level-card .level-icon { font-size: 2.2em; margin-bottom: 8px; }
.level-card .level-name { font-size: 0.95em; font-weight: 700; }
.level-card .level-sub { font-size: 0.75em; opacity: 0.7; margin-top: 4px; }
.level-stars { margin-top: 6px; font-size: 1.1em; letter-spacing: 2px; }

/* HUD */
#hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: 10px 16px;
  display: none;
  justify-content: space-between;
  align-items: center;
  z-index: 15;
  background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 100%);
}
#hud .hud-left, #hud .hud-right { display: flex; align-items: center; gap: 12px; }
.hud-item {
  color: #fff;
  font-size: 0.9em;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 4px;
}
#btn-pause {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.15);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
}

/* Knowledge Popup */
#knowledge-popup {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: linear-gradient(135deg, #003366, #005a9e);
  border: 3px solid #e87722;
  border-radius: 20px;
  padding: 28px 24px;
  max-width: 340px;
  width: 85%;
  color: #fff;
  text-align: center;
  z-index: 40;
  display: none;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}
#knowledge-popup h3 {
  color: #e87722;
  margin-bottom: 12px;
  font-size: 1.15em;
}
#knowledge-popup p {
  font-size: 0.9em;
  line-height: 1.5;
  margin-bottom: 16px;
}
#knowledge-popup button {
  padding: 10px 32px;
  border: none;
  border-radius: 25px;
  background: #e87722;
  color: #fff;
  font-weight: 700;
  font-size: 1em;
  cursor: pointer;
}

/* Pause Overlay */
#pause-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,20,50,0.85);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 35;
  color: #fff;
}
#pause-overlay h2 { font-size: 2em; margin-bottom: 24px; }

/* Level Complete */
#level-complete {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,20,50,0.9);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 35;
  color: #fff;
}
#level-complete h2 { font-size: 1.8em; margin-bottom: 8px; }
#level-complete .stars { font-size: 2.5em; margin: 16px 0; }
#level-complete .summary {
  font-size: 0.95em;
  line-height: 1.6;
  max-width: 320px;
  text-align: center;
  margin-bottom: 24px;
  opacity: 0.9;
}
.btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

/* Intro overlay */
#level-intro {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,20,50,0.92);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 35;
  color: #fff;
  padding: 24px;
  text-align: center;
}
#level-intro .intro-icon { font-size: 3em; margin-bottom: 12px; }
#level-intro h2 { font-size: 1.6em; margin-bottom: 8px; }
#level-intro .intro-desc {
  font-size: 0.9em; line-height: 1.6;
  max-width: 340px; margin-bottom: 24px;
  opacity: 0.9;
}

@media (max-width: 600px) {
  .logo-area h1 { font-size: 1.8em; }
  .logo-bcorp { font-size: 3em; }
  .level-grid { gap: 10px; padding: 16px; }
  .level-card { padding: 14px 10px; }
  .ctrl-btn { width: 56px; height: 56px; font-size: 24px; }
  #btn-jump { width: 70px; height: 70px; }
  .char-grid { gap: 12px; }
  .char-card { padding: 14px 10px; min-height: 120px; }
  .char-card .char-preview { font-size: 2.5em; }
}

/* Character Select */
#char-screen {
  background: linear-gradient(135deg, #003366 0%, #005a9e 50%, #e87722 100%);
}
.char-grid {
  display: flex;
  gap: 16px;
  padding: 20px;
  max-width: 500px;
  width: 100%;
  justify-content: center;
}
.char-card {
  background: rgba(255,255,255,0.1);
  border: 3px solid rgba(255,255,255,0.2);
  border-radius: 16px;
  padding: 20px 16px;
  text-align: center;
  color: #fff;
  cursor: pointer;
  transition: transform 0.15s, background 0.15s, border-color 0.15s;
  flex: 1;
  min-height: 140px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.char-card:hover, .char-card:active {
  transform: scale(1.05);
  background: rgba(255,255,255,0.2);
}
.char-card.selected {
  border-color: #e87722;
  background: rgba(232,119,34,0.25);
}
.char-card .char-preview { font-size: 3em; margin-bottom: 8px; line-height: 1; }
.char-card .char-name { font-size: 0.95em; font-weight: 700; }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>

<div id="ui-layer">
  <!-- START SCREEN -->
  <div id="start-screen" class="screen">
    <div class="logo-area">
      <div class="logo-bcorp">&#127759;</div>
      <h1>B-Corp Quest</h1>
      <h2>Driessen Groep</h2>
    </div>
    <button class="start-btn" onclick="showLevelSelect()">Speel Nu!</button>
    <button class="menu-btn" onclick="showInfo()">Wat is B-Corp?</button>
  </div>

  <!-- CHARACTER SELECT -->
  <div id="char-screen" class="screen hidden">
    <h2 style="color:#fff; margin-bottom:6px; font-size:1.4em;">Kies je karakter</h2>
    <p style="color:rgba(255,255,255,0.7); margin-bottom:16px; font-size:0.9em;">Wie wil jij zijn bij Driessen Groep?</p>
    <div class="char-grid">
      <div class="char-card" onclick="selectCharacter('man')">
        <div class="char-preview">&#128104;</div>
        <div class="char-name">Collega</div>
      </div>
      <div class="char-card" onclick="selectCharacter('vrouw')">
        <div class="char-preview">&#128105;</div>
        <div class="char-name">Collega</div>
      </div>
      <div class="char-card" onclick="selectCharacter('driessen')">
        <div class="char-preview">&#127775;</div>
        <div class="char-name">Driessen</div>
      </div>
    </div>
    <button class="menu-btn" style="margin-top:16px;" onclick="showStart()">&#8592; Terug</button>
  </div>

  <!-- LEVEL SELECT -->
  <div id="level-screen" class="screen hidden">
    <h2 style="color:#fff; margin-bottom:20px; font-size:1.4em;">Kies een Level</h2>
    <div class="level-grid" id="level-grid"></div>
    <div style="display:flex; gap:10px; margin-top:16px;">
      <button class="menu-btn" onclick="showCharSelect()">&#128100; Karakter</button>
      <button class="menu-btn" onclick="showStart()">&#8592; Terug</button>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-left">
      <button id="btn-pause" onclick="togglePause()">&#10074;&#10074;</button>
      <span class="hud-item" id="hud-level">Level 1</span>
    </div>
    <div class="hud-right">
      <span class="hud-item">&#11088; <span id="hud-score">0</span></span>
      <span class="hud-item">&#128218; <span id="hud-facts">0</span>/<span id="hud-facts-total">0</span></span>
    </div>
  </div>

  <!-- Mobile Controls -->
  <div id="mobile-controls">
    <div class="ctrl-row">
      <div class="ctrl-left-group">
        <button class="ctrl-btn" id="btn-left">&#9664;</button>
        <button class="ctrl-btn" id="btn-right">&#9654;</button>
      </div>
      <div class="ctrl-right-group">
        <button class="ctrl-btn" id="btn-jump">&#9650;</button>
      </div>
    </div>
  </div>

  <!-- Knowledge Popup -->
  <div id="knowledge-popup">
    <h3 id="kp-title">B-Corp Feit</h3>
    <p id="kp-text">Tekst hier...</p>
    <button onclick="closeKnowledge()">Begrepen! &#128077;</button>
  </div>

  <!-- Pause -->
  <div id="pause-overlay">
    <h2>Gepauzeerd</h2>
    <button class="start-btn" onclick="togglePause()">Verder Spelen</button>
    <button class="menu-btn" style="margin-top:12px;" onclick="quitToMenu()">Stoppen</button>
  </div>

  <!-- Level Complete -->
  <div id="level-complete">
    <h2 id="lc-title">Level Compleet!</h2>
    <div class="stars" id="lc-stars">&#11088;&#11088;&#11088;</div>
    <div class="summary" id="lc-summary"></div>
    <div class="btn-row">
      <button class="menu-btn" onclick="quitToMenu()">Menu</button>
      <button class="start-btn" id="lc-next" onclick="nextLevel()">Volgend Level &#9654;</button>
    </div>
  </div>

  <!-- Level Intro -->
  <div id="level-intro">
    <div class="intro-icon" id="intro-icon"></div>
    <h2 id="intro-title"></h2>
    <p class="intro-desc" id="intro-desc"></p>
    <button class="start-btn" onclick="startLevelFromIntro()">Start! &#127918;</button>
  </div>
</div>

let levelStars = [0, 0, 0, 0];
let selectedChar = ''; // 'man', 'vrouw', 'driessen'

// Try to load progress
try {
  const saved = JSON.parse(localStorage.getItem('bcorp_progress'));
  if (saved) {
    unlockedLevels = saved.unlocked || unlockedLevels;
    levelStars = saved.stars || levelStars;
    selectedChar = saved.character || '';
  }
} catch(e) {}

function saveProgress() {
  try {
    localStorage.setItem('bcorp_progress', JSON.stringify({
      unlocked: unlockedLevels,
      stars: levelStars,
      character: selectedChar
    }));
  } catch(e) {}
}

// AUDIO SYSTEM (Web Audio API)
// ========================
let audioCtx = null;
let musicGain = null;
let sfxGain = null;
let musicPlaying = false;
let musicOscillators = [];

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // Master gains
    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0.12;
    musicGain.connect(audioCtx.destination);
    sfxGain = audioCtx.createGain();
    sfxGain.gain.value = 0.25;
    sfxGain.connect(audioCtx.destination);
  } catch(e) {}
}

// Ensure audio starts on first user interaction
function ensureAudio() {
  if (!audioCtx) initAudio();
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}
document.addEventListener('click', ensureAudio, { once: false });
document.addEventListener('touchstart', ensureAudio, { once: false });
document.addEventListener('keydown', ensureAudio, { once: false });

function playTone(freq, duration, type, gainNode, volume, detune) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  if (detune) osc.detune.value = detune;
  g.gain.value = volume || 0.3;
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(g);
  g.connect(gainNode || sfxGain);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function sfxJump() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(250, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.12);
  g.gain.setValueAtTime(0.2, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
  osc.connect(g);
  g.connect(sfxGain);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.15);
}

function sfxCoin() {
  if (!audioCtx) return;
  playTone(988, 0.08, 'square', sfxGain, 0.2);
  setTimeout(() => playTone(1319, 0.12, 'square', sfxGain, 0.2), 60);
}

function sfxFact() {
  if (!audioCtx) return;
  const notes = [523, 659, 784, 1047];
  notes.forEach((n, i) => {
    setTimeout(() => playTone(n, 0.15, 'triangle', sfxGain, 0.2), i * 80);
  });
}

function sfxDeath() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(400, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.4);
  g.gain.setValueAtTime(0.2, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
  osc.connect(g);
  g.connect(sfxGain);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.5);
}

function sfxLevelComplete() {
  if (!audioCtx) return;
  const notes = [523, 659, 784, 659, 784, 1047];
  notes.forEach((n, i) => {
    setTimeout(() => playTone(n, 0.2, 'triangle', sfxGain, 0.25), i * 120);
  });
}

// Simple background music - gentle looping melody
let musicInterval = null;
function startMusic() {
  if (!audioCtx || musicPlaying) return;
  musicPlaying = true;
  const scale = [262, 294, 330, 349, 392, 440, 494, 523]; // C major
  // Melody patterns per level mood
  const melodies = [
    [0,2,4,5,4,2,3,1], // warm, hopeful
    [0,4,3,5,2,4,1,3], // nature, flowing
    [0,3,5,4,2,5,3,1], // steady, structured
    [0,2,4,7,5,3,4,2], // uplifting, climactic
  ];
  const melody = melodies[currentLevel % melodies.length];
  let step = 0;

  function playNote() {
    if (!musicPlaying || !audioCtx) return;
    const noteIdx = melody[step % melody.length];
    const freq = scale[noteIdx];
    // Melody
    playTone(freq * 2, 0.35, 'triangle', musicGain, 0.15);
    // Bass (root note, lower octave)
    if (step % 2 === 0) {
      playTone(scale[melody[0]] * 0.5, 0.7, 'sine', musicGain, 0.1);
    }
    step++;
  }

  playNote();
  musicInterval = setInterval(playNote, 400);
}

function stopMusic() {
  musicPlaying = false;
  if (musicInterval) { clearInterval(musicInterval); musicInterval = null; }
}

function buildLevelGrid() {
  const grid = document.getElementById('level-grid');
  grid.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const card = document.createElement('div');
    card.className = 'level-card' + (unlockedLevels[i] ? '' : ' locked');
    const stars = levelStars[i];
    const starStr = '&#11088;'.repeat(stars) + '&#9734;'.repeat(3 - stars);
    card.innerHTML = `
      <div class="level-icon">${lv.icon}</div>
      <div class="level-name">${lv.name}</div>
      <div class="level-sub">${lv.subtitle}</div>
      <div class="level-stars">${unlockedLevels[i] ? starStr : '&#128274;'}</div>
    `;
    if (unlockedLevels[i]) {
      card.onclick = () => showLevelIntro(i);
    }
    grid.appendChild(card);
  });
}

function startLevelFromIntro() {
  document.getElementById('level-intro').style.display = 'none';

}

function startLevel(idx) {
  currentLevel = idx;
  const lv = LEVELS[idx];

  // Reset player
  player.x = 80;
  player.y = lv.platforms[0].y * TILE - player.h - 4;
  player.vx = 0;
  player.vy = 0;
  player.onGround = false;
  player.alive = true;
  player.facing = 1;

  // Build level data
  levelPlatforms = lv.platforms.map(p => ({
    x: p.x * TILE, y: p.y * TILE,
    w: p.w * TILE, h: p.h * TILE
  }));
  levelCollectibles = lv.collectibles.map((c, ci) => ({
    x: c.x * TILE + TILE/2, y: c.y * TILE + TILE/2,
    type: c.type, icon: c.icon || '',
    title: c.title || '', text: c.text || '',
    collected: false, id: ci
  }));
  levelHazards = lv.hazards.map(h => ({
    x: h.x * TILE, y: h.y * TILE,
    w: h.w * TILE, h: TILE,
    type: h.type
  }));
  levelFinish = { x: lv.finish.x * TILE, y: lv.finish.y * TILE };

  totalFacts = levelCollectibles.filter(c => c.type === 'fact').length;
  factsCollected = 0;
  score = 0;
  collectedSet.clear();
  cameraX = 0;
  particles = [];

  // UI
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('hud-level').textContent = `Level ${idx + 1}`;
  updateHUD();

  const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  document.getElementById('mobile-controls').style.display = isMobile ? 'block' : 'none';

  deathTimer = 0;
  gameState = 'playing';
  ensureAudio();
  stopMusic();
  startMusic();
}

function updateHUD() {
  document.getElementById('hud-score').textContent = score;
  document.getElementById('hud-facts').textContent = factsCollected;
  document.getElementById('hud-facts-total').textContent = totalFacts;
}

function togglePause() {
  if (gameState === 'playing') {
    gameState = 'paused';
    document.getElementById('pause-overlay').style.display = 'flex';
  } else if (gameState === 'paused') {
    gameState = 'playing';
    document.getElementById('pause-overlay').style.display = 'none';
  }
}

function quitToMenu() {
  stopMusic();
  document.getElementById('pause-overlay').style.display = 'none';
  document.getElementById('level-complete').style.display = 'none';
  document.getElementById('hud').style.display = 'none';
  document.getElementById('mobile-controls').style.display = 'none';
  document.getElementById('char-screen').classList.add('hidden');

}

  document.getElementById('knowledge-popup').style.display = 'none';

    gameState = 'playing';
  }
}

function showLevelComplete() {
  gameState = 'levelcomplete';
  const lv = LEVELS[currentLevel];
  const factRatio = totalFacts > 0 ? factsCollected / totalFacts : 0;
  let stars = 1;
  if (factRatio >= 0.6) stars = 2;
  if (factRatio >= 1.0) stars = 3;

  if (stars > levelStars[currentLevel]) levelStars[currentLevel] = stars;
  if (currentLevel + 1 < LEVELS.length) unlockedLevels[currentLevel + 1] = true;
  saveProgress();

  const starStr = '&#11088;'.repeat(stars) + '&#9734;'.repeat(3 - stars);
  document.getElementById('lc-title').textContent = currentLevel === 3 ? 'Alle Levels Voltooid!' : 'Level Compleet!';
  document.getElementById('lc-stars').innerHTML = starStr;
  document.getElementById('lc-summary').textContent = lv.completeSummary;

  const nextBtn = document.getElementById('lc-next');
  if (currentLevel < LEVELS.length - 1) {
    nextBtn.style.display = 'inline-block';
    nextBtn.textContent = 'Volgend Level ▶';
  } else {
    nextBtn.style.display = 'none';
  }

  document.getElementById('level-complete').style.display = 'flex';
}

function nextLevel() {
  document.getElementById('level-complete').style.display = 'none';
  if (currentLevel < LEVELS.length - 1) {
    showLevelIntro(currentLevel + 1);
  }
}

  if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') && !jumpPressed) {

});

  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') {
    keys.jump = false;
    jumpPressed = false;
  }
});

// Mobile controls
function setupMobileBtn(id, key) {
  const btn = document.getElementById(id);
  const start = (e) => { e.preventDefault(); keys[key] = true; btn.classList.add('active'); };
  const end = (e) => { e.preventDefault(); keys[key] = false; btn.classList.remove('active'); if(key==='jump') jumpPressed = false; };
  btn.addEventListener('touchstart', start, {passive: false});
  btn.addEventListener('touchend', end, {passive: false});
  btn.addEventListener('touchcancel', end, {passive: false});
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', end);
  btn.addEventListener('mouseleave', end);
}
setupMobileBtn('btn-left', 'left');
setupMobileBtn('btn-right', 'right');
setupMobileBtn('btn-jump', 'jump');

// ========================
// PHYSICS & GAME LOGIC
// ========================
function updatePlayer() {
  if (!player.alive) return;

  // Movement
  if (keys.left) { player.vx = -MOVE_SPEED; player.facing = -1; }
  else if (keys.right) { player.vx = MOVE_SPEED; player.facing = 1; }
  else { player.vx *= 0.7; if (Math.abs(player.vx) < 0.2) player.vx = 0; }

  // Jump
  if (keys.jump && player.onGround && !jumpPressed) {
    player.vy = JUMP_FORCE;
    player.onGround = false;
    sfxJump();
  }
  if (keys.jump && player.onGround) {
    player.vy = JUMP_FORCE;
    player.onGround = false;
    keys.jump = false;
    sfxJump();
  }

  // Gravity
  player.vy += GRAVITY;
  if (player.vy > 15) player.vy = 15;

  // Move X
  player.x += player.vx;
  for (const p of levelPlatforms) {
    if (rectOverlap(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
      player.vx = 0;
    }
  }

  // Move Y
  player.y += player.vy;
  player.onGround = false;
  for (const p of levelPlatforms) {
    if (rectOverlap(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
      if (player.vy > 0) {
        player.y = p.y - player.h;
        player.onGround = true;
      } else if (player.vy < 0) {
        player.y = p.y + p.h;
      }
      player.vy = 0;
    }
  }

  // Bounds
  if (player.x < 0) player.x = 0;

  // Fall death
  if (player.y > H + 100) {
    startDeath();
    return;
  }

  // Walk animation
  if (Math.abs(player.vx) > 0.5) player.walkFrame += 0.15;

  // Collectibles
  for (const c of levelCollectibles) {
    if (c.collected) continue;
    const dx = (player.x + player.w/2) - c.x;
    const dy = (player.y + player.h/2) - c.y;
    if (Math.abs(dx) < 28 && Math.abs(dy) < 28) {
      c.collected = true;
      collectedSet.add(c.id);
      if (c.type === 'coin') {
        score += 10;
        spawnParticles(c.x, c.y, '#FFD700', 6);
        sfxCoin();
      } else if (c.type === 'fact') {
        score += 25;
        factsCollected++;
        spawnParticles(c.x, c.y, LEVELS[currentLevel].color1, 10);
        sfxFact();
        showKnowledge(c);
      }
      updateHUD();
    }
  }

  // Hazards
  for (const h of levelHazards) {
    if (rectOverlap(player.x, player.y, player.w, player.h, h.x, h.y, h.w, h.h)) {
      startDeath();
      return;
    }
  }

  // Finish
  const fdx = (player.x + player.w/2) - (levelFinish.x + TILE/2);
  const fdy = (player.y + player.h/2) - (levelFinish.y + TILE/2);
  if (Math.abs(fdx) < TILE && Math.abs(fdy) < TILE) {
    sfxLevelComplete();
    stopMusic();
    showLevelComplete();
  }
}

function startDeath() {
  if (deathTimer > 0) return; // Already dying
  deathTimer = DEATH_FREEZE_FRAMES;
  player.alive = false;
  player.vx = 0;
  player.vy = 0;
  spawnParticles(player.x + player.w/2, player.y + player.h/2, '#ff4444', 15);
  sfxDeath();
}

function respawnPlayer() {
  const lv = LEVELS[currentLevel];
  player.x = 80;
  player.y = lv.platforms[0].y * TILE - player.h - 4;
  player.vx = 0;
  player.vy = 0;
  player.onGround = false;
  player.alive = true;
  deathTimer = 0;
  spawnParticles(player.x + player.w/2, player.y + player.h/2, '#44aaff', 10);
}

function rectOverlap(x1,y1,w1,h1, x2,y2,w2,h2) {
  return x1 < x2+w2 && x1+w1 > x2 && y1 < y2+h2 && y1+h1 > y2;
}

// ========================
// PARTICLES
// ========================
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random()-0.5) * 6,
      vy: (Math.random()-0.5) * 6 - 2,
      life: 1,
      color,
      size: 3 + Math.random() * 4
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= 0.025;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ========================
// RENDERING
// ========================
function render() {
  if (gameState === 'menu') {
    ctx.fillStyle = '#0a1628';
    ctx.fillRect(0, 0, W, H);
    return;
  }
  if (gameState !== 'playing' && gameState !== 'paused' && gameState !== 'knowledge' && gameState !== 'levelcomplete') {
    ctx.fillStyle = '#0a1628';
    ctx.fillRect(0, 0, W, H);
    return;
  }

  const lv = LEVELS[currentLevel];

  // Camera
  const targetCam = player.x - W / 3;
  cameraX += (targetCam - cameraX) * 0.1;
  if (cameraX < 0) cameraX = 0;

  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, lv.bgColor1);
  grad.addColorStop(1, lv.bgColor2);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Background decorations (parallax stars/dots)
  drawBgDecorations(lv);

  ctx.save();
  ctx.translate(-cameraX, 0);

  // Platforms
  drawPlatforms(lv);

  // Hazards
  drawHazards(lv);

  // Collectibles
  drawCollectibles(lv);

  // Finish flag
  drawFinish(lv);

  // Player
  drawPlayer(lv);

  // Particles
  drawParticles();

  ctx.restore();

  // Death freeze overlay
  if (deathTimer > 0) {
    const progress = deathTimer / DEATH_FREEZE_FRAMES;
    // Red vignette flash that fades
    ctx.fillStyle = `rgba(180, 20, 20, ${progress * 0.35})`;
    ctx.fillRect(0, 0, W, H);
    // Screen shake effect via slight offset (already rendered, just overlay)
    if (deathTimer > DEATH_FREEZE_FRAMES - 10) {
      ctx.fillStyle = `rgba(255, 255, 255, ${(deathTimer - DEATH_FREEZE_FRAMES + 10) * 0.06})`;
      ctx.fillRect(0, 0, W, H);
    }
  }
}

function drawBgDecorations(lv) {
  const time = animFrame * 0.02;
  const theme = lv.theme || 'city';

  if (theme === 'city') {
    // City skyline with lit windows
    for (let i = 0; i < 14; i++) {
      const bx = i * 140 - (cameraX * 0.15) % (140 * 14);
      const bh = 80 + (i * 47) % 120;
      const bw = 60 + (i * 23) % 50;
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.fillRect(bx, H - bh - 60, bw, bh);
      // Windows
      ctx.fillStyle = 'rgba(255,200,80,0.12)';
      for (let wy = H - bh - 50; wy < H - 70; wy += 18) {
        for (let wx = bx + 8; wx < bx + bw - 8; wx += 14) {
          if ((wx * 7 + wy * 3) % 5 !== 0) {
            ctx.fillRect(wx, wy, 6, 8);
          }
        }
      }
    }
    // People silhouettes walking (far background)
    ctx.globalAlpha = 0.06;
    for (let i = 0; i < 8; i++) {
      const px = ((i * 320 + 100) - (cameraX * 0.08)) % (W + 200);
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(px, H - 68, 5, 0, Math.PI * 2); // head
      ctx.fillRect(px - 3, H - 63, 6, 14); // body
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else if (theme === 'nature') {
    // Rolling hills
    ctx.fillStyle = 'rgba(46,204,64,0.06)';
    ctx.beginPath();
    ctx.moveTo(0, H - 60);
    for (let x = 0; x <= W; x += 40) {
      ctx.lineTo(x, H - 60 - Math.sin((x + cameraX * 0.1) * 0.01) * 30 - 20);
    }
    ctx.lineTo(W, H); ctx.lineTo(0, H);
    ctx.fill();
    // Trees (parallax)
    for (let i = 0; i < 18; i++) {
      const tx = i * 180 - (cameraX * 0.12) % (180 * 18);
      const th = 40 + (i * 17) % 40;
      const ty = H - 65 - th;
      // Trunk
      ctx.fillStyle = 'rgba(100,70,30,0.08)';
      ctx.fillRect(tx + 10, ty + th * 0.5, 8, th * 0.5);
      // Leaves
      ctx.fillStyle = 'rgba(46,204,64,0.08)';
      ctx.beginPath();
      ctx.arc(tx + 14, ty + th * 0.3, th * 0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(tx + 6, ty + th * 0.45, th * 0.25, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(tx + 22, ty + th * 0.45, th * 0.25, 0, Math.PI * 2);
      ctx.fill();
    }
    // Clouds
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    for (let i = 0; i < 6; i++) {
      const cx = ((i * 280 + 50) - (cameraX * 0.05)) % (W + 300);
      const cy = 40 + (i * 33) % 80;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 50, 18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx - 30, cy + 5, 30, 14, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx + 35, cy + 5, 35, 14, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // Floating leaves
    ctx.globalAlpha = 0.15;
    for (let i = 0; i < 12; i++) {
      const lx = ((i * 200 + animFrame * 0.3) % (W + 100));
      const ly = (i * 70 + 30) % (H - 100) + Math.sin(time * 2 + i) * 15;
      ctx.fillStyle = i % 3 === 0 ? '#2ecc40' : '#6bef78';
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(time + i);
      ctx.fillRect(-4, -2, 8, 4);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  } else if (theme === 'office') {
    // Bookshelves and columns
    for (let i = 0; i < 10; i++) {
      const bx = i * 200 - (cameraX * 0.12) % (200 * 10);
      // Column
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.fillRect(bx, H - 180, 20, 130);
      ctx.fillRect(bx - 5, H - 185, 30, 8);
      ctx.fillRect(bx - 5, H - 52, 30, 8);
      // Bookshelf between columns
      ctx.fillStyle = 'rgba(52,152,219,0.04)';
      ctx.fillRect(bx + 30, H - 160, 120, 105);
      // Books
      const bookColors = ['rgba(231,77,60,0.08)','rgba(52,152,219,0.08)','rgba(46,204,64,0.08)','rgba(232,119,34,0.08)'];
      for (let shelf = 0; shelf < 3; shelf++) {
        for (let b = 0; b < 7; b++) {
          ctx.fillStyle = bookColors[(b + shelf) % bookColors.length];
          const bookW = 10 + (b * 3) % 8;
          ctx.fillRect(bx + 35 + b * 16, H - 155 + shelf * 35, bookW, 28);
        }
      }
    }
    // Clock
    const clockX = W / 2 - (cameraX * 0.05) % 100;
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(clockX, 60, 25, 0, Math.PI * 2);
    ctx.stroke();
    // Clock hands
    ctx.beginPath();
    ctx.moveTo(clockX, 60);
    ctx.lineTo(clockX + Math.cos(time * 0.5) * 15, 60 + Math.sin(time * 0.5) * 15);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(clockX, 60);
    ctx.lineTo(clockX + Math.cos(time * 3) * 20, 60 + Math.sin(time * 3) * 20);
    ctx.stroke();
  } else if (theme === 'community') {
    // Festive: floating hearts, stars, confetti
    ctx.globalAlpha = 0.08;
    for (let i = 0; i < 20; i++) {
      const sx = ((i * 170 + 40) - (cameraX * 0.1)) % (W + 200);
      const sy = (i * 67 + 20) % (H - 100);
      const s = 8 + (i % 5) * 3;
      ctx.fillStyle = ['#9b59b6','#e87722','#2ecc40','#3498db','#e74c3c'][i % 5];
      if (i % 3 === 0) {
        // Star
        drawStar(ctx, sx, sy + Math.sin(time + i) * 8, s, 5);
        ctx.fill();
      } else if (i % 3 === 1) {
        // Heart
        drawHeart(ctx, sx, sy + Math.sin(time * 0.8 + i) * 6, s);
        ctx.fill();
      } else {
        // Circle confetti
        ctx.beginPath();
        ctx.arc(sx, sy + Math.sin(time * 1.2 + i) * 10, s * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    // Bunting/banner
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 50);
    for (let x = 0; x <= W; x += 60) {
      ctx.lineTo(x, 50 + Math.sin((x - cameraX * 0.1) * 0.03) * 15);
    }
    ctx.stroke();
    // Flags on the bunting
    for (let x = 15; x <= W; x += 60) {
      const by = 50 + Math.sin((x - cameraX * 0.1) * 0.03) * 15;
      ctx.fillStyle = x % 120 < 60 ? 'rgba(232,119,34,0.08)' : 'rgba(155,89,182,0.08)';
      ctx.beginPath();
      ctx.moveTo(x - 8, by);
      ctx.lineTo(x + 8, by);
      ctx.lineTo(x, by + 18);
      ctx.closePath();
      ctx.fill();
    }
  }

  // Stars/dots in all themes
  ctx.globalAlpha = 0.2;
  for (let i = 0; i < 20; i++) {
    const x = ((i * 137 + 50) % W + W - (cameraX * 0.08) % W) % W;
    const y = (i * 89 + 20) % (H * 0.4);
    const s = 1 + (i % 2);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x, y, s, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawStar(ctx, cx, cy, r, points) {
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const radius = i % 2 === 0 ? r : r * 0.4;
    const angle = (i * Math.PI) / points - Math.PI / 2;
    if (i === 0) ctx.moveTo(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
    else ctx.lineTo(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
  }
  ctx.closePath();
}

function drawHeart(ctx, cx, cy, size) {
  ctx.beginPath();
  ctx.moveTo(cx, cy + size * 0.3);
  ctx.bezierCurveTo(cx, cy - size * 0.3, cx - size, cy - size * 0.3, cx - size, cy + size * 0.1);
  ctx.bezierCurveTo(cx - size, cy + size * 0.6, cx, cy + size, cx, cy + size);
  ctx.bezierCurveTo(cx, cy + size, cx + size, cy + size * 0.6, cx + size, cy + size * 0.1);
  ctx.bezierCurveTo(cx + size, cy - size * 0.3, cx, cy - size * 0.3, cx, cy + size * 0.3);
  ctx.closePath();
}

function drawPlatforms(lv) {
  const theme = lv.theme || 'city';
  for (const p of levelPlatforms) {
    // Main platform
    const pg = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
    pg.addColorStop(0, lv.color1);
    pg.addColorStop(1, lv.color2);
    ctx.fillStyle = pg;
    roundRect(ctx, p.x, p.y, p.w, p.h, 6);
    ctx.fill();

    // Top highlight
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(p.x + 4, p.y + 2, p.w - 8, 3);

    // Theme-specific platform details
    if (theme === 'city' && p.h > TILE) {
      // Brick pattern
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      for (let by = p.y + 12; by < p.y + p.h - 4; by += 10) {
        const offset = ((by - p.y) / 10) % 2 === 0 ? 0 : 12;
        for (let bx = p.x + 4 + offset; bx < p.x + p.w - 4; bx += 24) {
          ctx.fillRect(bx, by, 20, 1);
        }
      }
    } else if (theme === 'nature') {
      // Grass on top
      ctx.fillStyle = 'rgba(100,255,100,0.25)';
      for (let gx = p.x + 4; gx < p.x + p.w - 4; gx += 8) {
        const gh = 4 + Math.sin(gx * 0.3) * 2;
        ctx.fillRect(gx, p.y - gh, 3, gh);
      }
      // Dirt texture
      if (p.h > TILE) {
        ctx.fillStyle = 'rgba(0,0,0,0.06)';
        for (let i = 0; i < 6; i++) {
          const dx = p.x + 10 + ((i * 37) % (p.w - 20));
          const dy = p.y + 15 + ((i * 23) % (p.h - 20));
          ctx.beginPath();
          ctx.arc(dx, dy, 2 + i % 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    } else if (theme === 'office') {
      // Steel/concrete look with horizontal lines
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      for (let ly = p.y + 8; ly < p.y + p.h; ly += 12) {
        ctx.fillRect(p.x + 2, ly, p.w - 4, 1);
      }
      // Bolts at edges
      if (p.w > TILE * 2) {
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.arc(p.x + 8, p.y + 8, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(p.x + p.w - 8, p.y + 8, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (theme === 'community') {
      // Rainbow shimmer on top
      const colors = ['#e74c3c','#e87722','#f1c40f','#2ecc40','#3498db','#9b59b6'];
      const segW = p.w / colors.length;
      ctx.globalAlpha = 0.15;
      for (let ci = 0; ci < colors.length; ci++) {
        ctx.fillStyle = colors[ci];
        ctx.fillRect(p.x + ci * segW, p.y, segW + 1, 4);
      }
      ctx.globalAlpha = 1;
    } else {
      // Default decoration
      if (p.h > TILE) {
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        for (let gx = p.x + 8; gx < p.x + p.w - 8; gx += 16) {
          ctx.fillRect(gx, p.y - 2, 8, 4);
        }
      }
    }
  }
}

function drawHazards(lv) {
  const theme = lv.theme || 'city';
  const time = animFrame * 0.05;

  for (const h of levelHazards) {
    if (theme === 'city') {
      // Red tape / bureaucracy barriers
      ctx.fillStyle = '#cc3333';
      ctx.fillRect(h.x, h.y + 4, h.w, h.h - 4);
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(h.x, h.y + 8, h.w, 6);
      // Caution stripes
      ctx.fillStyle = 'rgba(255,255,0,0.4)';
      for (let sx = h.x; sx < h.x + h.w; sx += 16) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(h.x, h.y, h.w, h.h);
        ctx.clip();
        ctx.translate(sx, h.y);
        ctx.rotate(0.5);
        ctx.fillRect(0, 0, 6, h.h * 2);
        ctx.restore();
      }
      // Glow
      ctx.fillStyle = 'rgba(255,68,68,0.2)';
      ctx.fillRect(h.x, h.y - 4, h.w, h.h + 4);
    } else if (theme === 'nature') {
      // Toxic waste puddles
      ctx.fillStyle = 'rgba(100,50,0,0.6)';
      ctx.beginPath();
      ctx.ellipse(h.x + h.w / 2, h.y + h.h - 4, h.w / 2 + 4, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#88cc00';
      ctx.beginPath();
      ctx.ellipse(h.x + h.w / 2, h.y + h.h - 6, h.w / 2, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      // Bubbles
      ctx.fillStyle = 'rgba(200,255,0,0.5)';
      for (let b = 0; b < 3; b++) {
        const bx = h.x + 10 + (b * h.w / 3);
        const by = h.y + h.h - 10 - Math.abs(Math.sin(time + b * 2)) * 12;
        ctx.beginPath();
        ctx.arc(bx, by, 3 + Math.sin(time + b) * 1, 0, Math.PI * 2);
        ctx.fill();
      }
      // Skull
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('\u2620', h.x + h.w / 2, h.y + h.h - 6);
    } else if (theme === 'office') {
      // Paper shredder
      ctx.fillStyle = '#667';
      roundRect(ctx, h.x + 2, h.y, h.w - 4, h.h - 4, 4);
      ctx.fill();
      ctx.fillStyle = '#556';
      ctx.fillRect(h.x + 6, h.y + 2, h.w - 12, 8);
      // Slot
      ctx.fillStyle = '#333';
      ctx.fillRect(h.x + 10, h.y + 2, h.w - 20, 4);
      // Spinning blade indicator
      ctx.strokeStyle = 'rgba(255,100,100,0.6)';
      ctx.lineWidth = 2;
      const cx = h.x + h.w / 2;
      const cy = h.y + h.h / 2 + 4;
      for (let b = 0; b < 4; b++) {
        const angle = time * 3 + b * Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(angle) * 10, cy + Math.sin(angle) * 10);
        ctx.stroke();
      }
      // Red glow
      ctx.fillStyle = 'rgba(255,60,60,0.15)';
      ctx.fillRect(h.x, h.y - 2, h.w, h.h + 2);
    } else if (theme === 'community') {
      // Dark negativity clouds
      ctx.fillStyle = 'rgba(60,20,60,0.7)';
      const cx = h.x + h.w / 2;
      const cy = h.y + h.h / 2;
      ctx.beginPath();
      ctx.ellipse(cx, cy, h.w / 2 + 6, h.h / 2 + 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(80,30,80,0.5)';
      ctx.beginPath();
      ctx.ellipse(cx - h.w * 0.2, cy - 4, h.w * 0.3, h.h * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx + h.w * 0.2, cy - 2, h.w * 0.3, h.h * 0.35, 0, 0, Math.PI * 2);
      ctx.fill();
      // Angry face
      ctx.fillStyle = 'rgba(255,100,100,0.4)';
      ctx.font = '16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('\u2639', cx, cy + 5);
    } else {
      // Default spikes
      ctx.fillStyle = '#ff4444';
      for (let i = 0; i < h.w / 20; i++) {
        const sx = h.x + i * 20;
        ctx.beginPath();
        ctx.moveTo(sx, h.y + h.h);
        ctx.lineTo(sx + 10, h.y);
        ctx.lineTo(sx + 20, h.y + h.h);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,68,68,0.3)';
      ctx.fillRect(h.x, h.y - 4, h.w, h.h + 4);
    }
  }
}

function drawCollectibles(lv) {
  const time = animFrame * 0.05;
  for (const c of levelCollectibles) {
    if (c.collected) continue;
    const bob = Math.sin(time + c.x * 0.1) * 4;
    const cy = c.y + bob;

    if (c.type === 'coin') {
      // Golden coin
      const cg = ctx.createRadialGradient(c.x, cy, 2, c.x, cy, 12);
      cg.addColorStop(0, '#FFE66D');
      cg.addColorStop(1, '#FFB800');
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.arc(c.x, cy, 12, 0, Math.PI * 2);
      ctx.fill();
      // Shine
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      ctx.arc(c.x - 3, cy - 3, 4, 0, Math.PI * 2);
      ctx.fill();
      // B label
      ctx.fillStyle = '#996600';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('B', c.x, cy + 1);
    } else if (c.type === 'fact') {
      // Knowledge orb
      ctx.shadowColor = lv.color1;
      ctx.shadowBlur = 15;
      const fg = ctx.createRadialGradient(c.x, cy, 4, c.x, cy, 18);
      fg.addColorStop(0, '#fff');
      fg.addColorStop(0.4, lv.color1);
      fg.addColorStop(1, lv.color2);
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.arc(c.x, cy, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      // Icon
      ctx.fillStyle = '#fff';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('?', c.x, cy + 1);
      // Rotating ring
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(c.x, cy, 20, time % (Math.PI*2), time % (Math.PI*2) + Math.PI);
      ctx.stroke();
    }
  }
}

function drawFinish(lv) {
  const time = animFrame * 0.03;
  const fx = levelFinish.x;
  const fy = levelFinish.y;

  // Flag pole
  ctx.fillStyle = '#ddd';
  ctx.fillRect(fx + TILE/2 - 2, fy - 40, 4, 60);

  // Flag
  ctx.fillStyle = lv.color1;
  ctx.beginPath();
  ctx.moveTo(fx + TILE/2 + 2, fy - 38);
  ctx.lineTo(fx + TILE/2 + 30 + Math.sin(time) * 4, fy - 28);
  ctx.lineTo(fx + TILE/2 + 2, fy - 18);
  ctx.closePath();
  ctx.fill();

  // Star
  ctx.fillStyle = '#FFD700';
  ctx.font = '20px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('★', fx + TILE/2, fy - 48 + Math.sin(time * 2) * 3);

  // Glow at base
  ctx.fillStyle = `rgba(255,215,0,${0.2 + Math.sin(time * 3) * 0.1})`;
  ctx.beginPath();
  ctx.arc(fx + TILE/2, fy + 10, 25, 0, Math.PI * 2);
  ctx.fill();
}

function drawPlayer(lv) {
  const px = player.x;
  const py = player.y;
  const f = player.facing;

  ctx.save();
  ctx.translate(px + player.w/2, py + player.h/2);
  ctx.scale(f, 1);
  ctx.translate(-(player.w/2), -(player.h/2));

  const walk = Math.sin(player.walkFrame * 4);
  const isWalking = Math.abs(player.vx) > 0.5;
  const isAir = !player.onGround;
  const isDying = deathTimer > 0;
  const blink = Math.floor(animFrame / 60) % 4 === 0 && Math.floor(animFrame % 60) < 4;

  // Death flash effect
  if (isDying) {
    ctx.globalAlpha = 0.3 + Math.sin(deathTimer * 0.5) * 0.4;
  }

  // Shadow
  if (player.onGround && !isDying) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(player.w/2, player.h + 2, 12, 3, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // --- LEGS ---
  ctx.fillStyle = '#003366';
  const legW = 7, legH = 9;
  if (isWalking && !isAir && !isDying) {
    // Left leg
    ctx.save();
    ctx.translate(8, 27);
    ctx.rotate(walk * 0.35);
    roundRect(ctx, -3, 0, legW, legH, 2); ctx.fill();
    // Left shoe
    ctx.fillStyle = '#222';
    roundRect(ctx, -4, legH - 3, legW + 2, 4, 2); ctx.fill();
    ctx.restore();
    // Right leg
    ctx.fillStyle = '#003366';
    ctx.save();
    ctx.translate(20, 27);
    ctx.rotate(-walk * 0.35);
    roundRect(ctx, -3, 0, legW, legH, 2); ctx.fill();
    ctx.fillStyle = '#222';
    roundRect(ctx, -4, legH - 3, legW + 2, 4, 2); ctx.fill();
    ctx.restore();
  } else if (isAir) {
    // Jump pose - legs bent
    ctx.save();
    ctx.translate(8, 27);
    ctx.rotate(-0.4);
    roundRect(ctx, -3, 0, legW, legH - 1, 2); ctx.fill();
    ctx.fillStyle = '#222';
    roundRect(ctx, -4, legH - 4, legW + 2, 4, 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#003366';
    ctx.save();
    ctx.translate(20, 27);
    ctx.rotate(0.4);
    roundRect(ctx, -3, 0, legW, legH - 1, 2); ctx.fill();
    ctx.fillStyle = '#222';
    roundRect(ctx, -4, legH - 4, legW + 2, 4, 2); ctx.fill();
    ctx.restore();
  } else {
    // Standing
    roundRect(ctx, 5, 27, legW, legH, 2); ctx.fill();
    roundRect(ctx, 17, 27, legW, legH, 2); ctx.fill();
    ctx.fillStyle = '#222';
    roundRect(ctx, 4, 33, legW + 2, 4, 2); ctx.fill();
    roundRect(ctx, 16, 33, legW + 2, 4, 2); ctx.fill();
  }

  // --- BODY (Driessen orange polo) ---
  const bodyGrad = ctx.createLinearGradient(4, 12, 4, 28);
  bodyGrad.addColorStop(0, '#f08830');
  bodyGrad.addColorStop(1, '#d06a18');
  ctx.fillStyle = bodyGrad;
  roundRect(ctx, 4, 13, 22, 15, 5);
  ctx.fill();

  // Polo collar
  ctx.fillStyle = '#f5a050';
  ctx.beginPath();
  ctx.moveTo(10, 13);
  ctx.lineTo(15, 16);
  ctx.lineTo(20, 13);
  ctx.lineTo(18, 12);
  ctx.lineTo(15, 14);
  ctx.lineTo(12, 12);
  ctx.closePath();
  ctx.fill();

  // Shirt detail - subtle B-Corp badge
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.arc(22, 18, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#d06a18';
  ctx.font = 'bold 5px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('B', 22, 18.5);

  // --- BACK ARM (behind body) ---
  ctx.fillStyle = '#d06a18';
  if (isWalking && !isAir && !isDying) {
    ctx.save();
    ctx.translate(6, 15);
    ctx.rotate(-walk * 0.5);
    roundRect(ctx, -2, 0, 6, 12, 3); ctx.fill();
    // Hand
    ctx.fillStyle = '#F0B860';
    ctx.beginPath();
    ctx.arc(1, 12, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  } else if (isAir) {
    ctx.save();
    ctx.translate(6, 15);
    ctx.rotate(0.6);
    roundRect(ctx, -2, 0, 6, 11, 3); ctx.fill();
    ctx.fillStyle = '#F0B860';
    ctx.beginPath();
    ctx.arc(1, 11, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // --- FRONT ARM ---
  ctx.fillStyle = '#f08830';
  if (isWalking && !isAir && !isDying) {
    ctx.save();
    ctx.translate(22, 15);
    ctx.rotate(walk * 0.5);
    roundRect(ctx, -2, 0, 6, 12, 3); ctx.fill();
    ctx.fillStyle = '#FDBF60';
    ctx.beginPath();
    ctx.arc(1, 12, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  } else if (isAir) {
    // Arms up when jumping
    ctx.save();
    ctx.translate(22, 14);
    ctx.rotate(-0.8);
    roundRect(ctx, -2, -2, 6, 12, 3); ctx.fill();
    ctx.fillStyle = '#FDBF60';
    ctx.beginPath();
    ctx.arc(1, 9, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  } else {
    // Idle arms
    ctx.save();
    ctx.translate(22, 15);
    roundRect(ctx, -1, 0, 6, 11, 3); ctx.fill();
    ctx.fillStyle = '#FDBF60';
    ctx.beginPath();
    ctx.arc(2, 11, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // --- HEAD ---
  // Neck
  ctx.fillStyle = '#F0B860';
  ctx.fillRect(12, 9, 6, 5);

  // Head shape
  const headGrad = ctx.createRadialGradient(15, 6, 1, 15, 6, 11);
  headGrad.addColorStop(0, '#FECE78');
  headGrad.addColorStop(1, '#EDAA40');
  ctx.fillStyle = headGrad;
  ctx.beginPath();
  ctx.ellipse(15, 5, 11, 10, 0, 0, Math.PI * 2);
  ctx.fill();

  // Character-specific hair
  const charType = selectedChar || 'man';

  if (charType === 'vrouw') {
    // Longer hair with ponytail
    ctx.fillStyle = '#6B3020';
    ctx.beginPath();
    ctx.ellipse(15, 2, 12, 8.5, 0, Math.PI * 0.8, Math.PI * 2.2);
    ctx.fill();
    // Side flowing hair
    ctx.beginPath();
    ctx.ellipse(4, 5, 4, 8, 0.15, 0, Math.PI * 2);
    ctx.fill();
    // Long hair back
    ctx.fillRect(3, 6, 5, 14);
    ctx.beginPath();
    ctx.ellipse(5.5, 20, 3, 2, 0, 0, Math.PI * 2);
    ctx.fill();
    // Hair detail
    ctx.fillStyle = '#551A10';
    ctx.beginPath();
    ctx.ellipse(15, 0, 9.5, 5, 0, Math.PI * 0.85, Math.PI * 2.15);
    ctx.fill();
    // Ponytail
    ctx.fillStyle = '#6B3020';
    ctx.beginPath();
    ctx.moveTo(4, 3);
    ctx.quadraticCurveTo(-4, 8, -2, 18);
    ctx.quadraticCurveTo(0, 22, 5, 18);
    ctx.quadraticCurveTo(6, 10, 4, 3);
    ctx.fill();
    // Hair tie
    ctx.fillStyle = '#e87722';
    ctx.beginPath();
    ctx.ellipse(3, 12, 2.5, 2, 0.3, 0, Math.PI * 2);
    ctx.fill();
  } else if (charType === 'driessen') {
    // Beanie/cap with Driessen branding
    ctx.fillStyle = '#003366';
    ctx.beginPath();
    ctx.ellipse(15, 1, 12, 8, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(3, 1, 24, 5);
    // Cap brim
    ctx.fillStyle = '#002244';
    ctx.fillRect(2, 4, 26, 3);
    // Driessen D on cap
    ctx.fillStyle = '#e87722';
    ctx.font = 'bold 7px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('D', 15, 0);
    // Ear visible
    ctx.fillStyle = '#EDAA40';
    ctx.beginPath();
    ctx.ellipse(4, 6, 3, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#D09030';
    ctx.beginPath();
    ctx.ellipse(4.5, 6, 1.5, 2, 0, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Default man: short styled hair
    ctx.fillStyle = '#4A2810';
    ctx.beginPath();
    ctx.ellipse(15, 2, 11.5, 8, 0, Math.PI * 0.85, Math.PI * 2.15);
    ctx.fill();
    // Side hair
    ctx.beginPath();
    ctx.ellipse(5, 4, 3, 6, 0.2, 0, Math.PI * 2);
    ctx.fill();
    // Hair detail
    ctx.fillStyle = '#3A1E08';
    ctx.beginPath();
    ctx.ellipse(15, 0, 9, 5, 0, Math.PI * 0.9, Math.PI * 2.1);
    ctx.fill();
  }

  // Ear (man and vrouw, not driessen - already drawn)
  if (charType !== 'driessen') {
    ctx.fillStyle = '#EDAA40';
    ctx.beginPath();
    ctx.ellipse(5, 6, 3, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#D09030';
    ctx.beginPath();
    ctx.ellipse(5.5, 6, 1.5, 2.5, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Eyes
  if (isDying) {
    // X eyes when dying
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(16, 4); ctx.lineTo(19, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(19, 4); ctx.lineTo(16, 7); ctx.stroke();
  } else if (blink) {
    // Blink
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(16, 5.5);
    ctx.lineTo(21, 5.5);
    ctx.stroke();
  } else {
    // Eye white
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(18.5, 5.5, 4, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();
    // Iris
    ctx.fillStyle = charType === 'vrouw' ? '#6B4226' : charType === 'driessen' ? '#2E8B57' : '#2962A0';
    ctx.beginPath();
    ctx.arc(19.5, 5.5, 2.2, 0, Math.PI * 2);
    ctx.fill();
    // Pupil
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(19.8, 5.5, 1.2, 0, Math.PI * 2);
    ctx.fill();
    // Eye shine
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(20.3, 4.5, 0.7, 0, Math.PI * 2);
    ctx.fill();
    // Eyebrow
    ctx.strokeStyle = charType === 'vrouw' ? '#551A10' : '#3A1E08';
    ctx.lineWidth = charType === 'vrouw' ? 1.5 : 1.8;
    ctx.beginPath();
    ctx.moveTo(15, isAir ? 1.5 : 2.5);
    ctx.quadraticCurveTo(18, isAir ? 0 : 1.5, 22, isAir ? 1.5 : 2.5);
    ctx.stroke();
  }

  // Mouth
  if (isDying) {
    // O mouth
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.ellipse(19, 10, 2, 2.5, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (isAir) {
    // Excited open mouth
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.ellipse(19.5, 10, 2.5, 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#c0392b';
    ctx.beginPath();
    ctx.ellipse(19.5, 10.3, 1.8, 1.2, 0, 0, Math.PI);
    ctx.fill();
  } else {
    // Happy smile
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(18, 9, 4, 0.1, Math.PI * 0.6);
    ctx.stroke();
    // Cheek blush
    if (charType === 'vrouw') {
      ctx.fillStyle = 'rgba(255,100,120,0.25)';
      ctx.beginPath();
      ctx.ellipse(22, 8.5, 3, 2, 0, 0, Math.PI * 2);
      ctx.fill();
      // Lips
      ctx.fillStyle = 'rgba(200,80,80,0.4)';
      ctx.beginPath();
      ctx.ellipse(19, 10.5, 3, 1, 0, 0, Math.PI);
      ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(255,120,80,0.15)';
      ctx.beginPath();
      ctx.ellipse(22, 8, 3, 2, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Nose (subtle)
  ctx.fillStyle = '#EDAA40';
  ctx.beginPath();
  ctx.ellipse(21, 7, 1.2, 1, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ========================
// GAME LOOP
// ========================
function gameLoop() {
  animFrame++;

  if (gameState === 'playing') {
    if (deathTimer > 0) {
      deathTimer--;
      updateParticles(); // Keep particles animating during freeze
      if (deathTimer <= 0) {
        respawnPlayer();
      }
    } else {
      updatePlayer();
      updateParticles();
    }
  }

  render();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

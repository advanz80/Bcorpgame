// ========================
// PHYSICS & GAME LOGIC
// ========================
function updatePlayer() {
  if (!player.alive) return;

  // Movement
  if (keys.left) { player.vx = -MOVE_SPEED; player.facing = -1; }
  else if (keys.right) { player.vx = MOVE_SPEED; player.facing = 1; }
  else { player.vx *= 0.7; if (Math.abs(player.vx) < 0.2) player.vx = 0; }

  // Jump
  if (keys.jump && player.onGround && !jumpPressed) {
    player.vy = JUMP_FORCE;
    player.onGround = false;
    sfxJump();
  }
  if (keys.jump && player.onGround) {
    player.vy = JUMP_FORCE;
    player.onGround = false;
    keys.jump = false;
    sfxJump();
  }

  // Gravity
  player.vy += GRAVITY;
  if (player.vy > 15) player.vy = 15;

  // Move X
  player.x += player.vx;
  for (const p of levelPlatforms) {
    if (rectOverlap(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
      player.vx = 0;
    }
  }

  // Move Y
  player.y += player.vy;
  player.onGround = false;
  for (const p of levelPlatforms) {
    if (rectOverlap(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
      if (player.vy > 0) {
        player.y = p.y - player.h;
        player.onGround = true;
      } else if (player.vy < 0) {
        player.y = p.y + p.h;
      }
      player.vy = 0;
    }
  }

  // Bounds
  if (player.x < 0) player.x = 0;

  // Fall death
  if (player.y > H + 100) {
    startDeath();
    return;
  }

  // Walk animation
  if (Math.abs(player.vx) > 0.5) player.walkFrame += 0.15;

  // Collectibles
  for (const c of levelCollectibles) {
    if (c.collected) continue;
    const dx = (player.x + player.w/2) - c.x;
    const dy = (player.y + player.h/2) - c.y;
    if (Math.abs(dx) < 28 && Math.abs(dy) < 28) {
      c.collected = true;
      collectedSet.add(c.id);
      if (c.type === 'coin') {
        score += 10;
        spawnParticles(c.x, c.y, '#FFD700', 6);
        sfxCoin();
      } else if (c.type === 'fact') {
        score += 25;
        factsCollected++;
        spawnParticles(c.x, c.y, LEVELS[currentLevel].color1, 10);
        sfxFact();
        showKnowledge(c);
      }
      updateHUD();
    }
  }

  // Hazards
  for (const h of levelHazards) {
    if (rectOverlap(player.x, player.y, player.w, player.h, h.x, h.y, h.w, h.h)) {
      startDeath();
      return;
    }
  }

  // Finish
  const fdx = (player.x + player.w/2) - (levelFinish.x + TILE/2);
  const fdy = (player.y + player.h/2) - (levelFinish.y + TILE/2);
  if (Math.abs(fdx) < TILE && Math.abs(fdy) < TILE) {
    sfxLevelComplete();
    stopMusic();
    showLevelComplete();
  }
}

function startDeath() {
  if (deathTimer > 0) return; // Already dying
  deathTimer = DEATH_FREEZE_FRAMES;
  player.alive = false;
  player.vx = 0;
  player.vy = 0;
  spawnParticles(player.x + player.w/2, player.y + player.h/2, '#ff4444', 15);
  sfxDeath();
}

function respawnPlayer() {
  const lv = LEVELS[currentLevel];
  player.x = 80;
  player.y = lv.platforms[0].y * TILE - player.h - 4;
  player.vx = 0;
  player.vy = 0;
  player.onGround = false;
  player.alive = true;
  deathTimer = 0;
  spawnParticles(player.x + player.w/2, player.y + player.h/2, '#44aaff', 10);
}

function rectOverlap(x1,y1,w1,h1, x2,y2,w2,h2) {
  return x1 < x2+w2 && x1+w1 > x2 && y1 < y2+h2 && y1+h1 > y2;
}

// ========================
// PARTICLES
// ========================
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random()-0.5) * 6,
      vy: (Math.random()-0.5) * 6 - 2,
      life: 1,
      color,
      size: 3 + Math.random() * 4
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= 0.025;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ========================
// RENDERING
// ========================
function render() {
  if (gameState === 'menu') {
    ctx.fillStyle = '#0a1628';
    ctx.fillRect(0, 0, W, H);
    return;
  }
  if (gameState !== 'playing' && gameState !== 'paused' && gameState !== 'knowledge' && gameState !== 'levelcomplete') {
    ctx.fillStyle = '#0a1628';
    ctx.fillRect(0, 0, W, H);
    return;
  }

  const lv = LEVELS[currentLevel];

  // Camera
  const targetCam = player.x - W / 3;
  cameraX += (targetCam - cameraX) * 0.1;
  if (cameraX < 0) cameraX = 0;

  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, lv.bgColor1);
  grad.addColorStop(1, lv.bgColor2);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Background decorations (parallax stars/dots)
  drawBgDecorations(lv);

  ctx.save();
  ctx.translate(-cameraX, 0);

  // Platforms
  drawPlatforms(lv);

  // Hazards
  drawHazards(lv);

  // Collectibles
  drawCollectibles(lv);

  // Finish flag
  drawFinish(lv);

  // Player
  drawPlayer(lv);

  // Particles
  drawParticles();

  ctx.restore();

  // Death freeze overlay
  if (deathTimer > 0) {
    const progress = deathTimer / DEATH_FREEZE_FRAMES;
    // Red vignette flash that fades
    ctx.fillStyle = `rgba(180, 20, 20, ${progress * 0.35})`;
    ctx.fillRect(0, 0, W, H);
    // Screen shake effect via slight offset (already rendered, just overlay)
    if (deathTimer > DEATH_FREEZE_FRAMES - 10) {
      ctx.fillStyle = `rgba(255, 255, 255, ${(deathTimer - DEATH_FREEZE_FRAMES + 10) * 0.06})`;
      ctx.fillRect(0, 0, W, H);
    }
  }
}

function drawBgDecorations(lv) {
  const time = animFrame * 0.02;
  const theme = lv.theme || 'city';

  if (theme === 'city') {
    // City skyline with lit windows
    for (let i = 0; i < 14; i++) {
      const bx = i * 140 - (cameraX * 0.15) % (140 * 14);
      const bh = 80 + (i * 47) % 120;
      const bw = 60 + (i * 23) % 50;
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.fillRect(bx, H - bh - 60, bw, bh);
      // Windows
      ctx.fillStyle = 'rgba(255,200,80,0.12)';
      for (let wy = H - bh - 50; wy < H - 70; wy += 18) {
        for (let wx = bx + 8; wx < bx + bw - 8; wx += 14) {
          if ((wx * 7 + wy * 3) % 5 !== 0) {
            ctx.fillRect(wx, wy, 6, 8);
          }
        }
      }
    }
    // People silhouettes walking (far background)
    ctx.globalAlpha = 0.06;
    for (let i = 0; i < 8; i++) {
      const px = ((i * 320 + 100) - (cameraX * 0.08)) % (W + 200);
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(px, H - 68, 5, 0, Math.PI * 2); // head
      ctx.fillRect(px - 3, H - 63, 6, 14); // body
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else if (theme === 'nature') {
    // Rolling hills
    ctx.fillStyle = 'rgba(46,204,64,0.06)';
    ctx.beginPath();
    ctx.moveTo(0, H - 60);
    for (let x = 0; x <= W; x += 40) {
      ctx.lineTo(x, H - 60 - Math.sin((x + cameraX * 0.1) * 0.01) * 30 - 20);
    }
    ctx.lineTo(W, H); ctx.lineTo(0, H);
    ctx.fill();
    // Trees (parallax)
    for (let i = 0; i < 18; i++) {
      const tx = i * 180 - (cameraX * 0.12) % (180 * 18);
      const th = 40 + (i * 17) % 40;
      const ty = H - 65 - th;
      // Trunk
      ctx.fillStyle = 'rgba(100,70,30,0.08)';
      ctx.fillRect(tx + 10, ty + th * 0.5, 8, th * 0.5);
      // Leaves
      ctx.fillStyle = 'rgba(46,204,64,0.08)';
      ctx.beginPath();
      ctx.arc(tx + 14, ty + th * 0.3, th * 0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(tx + 6, ty + th * 0.45, th * 0.25, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(tx + 22, ty + th * 0.45, th * 0.25, 0, Math.PI * 2);
      ctx.fill();
    }
    // Clouds
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    for (let i = 0; i < 6; i++) {
      const cx = ((i * 280 + 50) - (cameraX * 0.05)) % (W + 300);
      const cy = 40 + (i * 33) % 80;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 50, 18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx - 30, cy + 5, 30, 14, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx + 35, cy + 5, 35, 14, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // Floating leaves
    ctx.globalAlpha = 0.15;
    for (let i = 0; i < 12; i++) {
      const lx = ((i * 200 + animFrame * 0.3) % (W + 100));
      const ly = (i * 70 + 30) % (H - 100) + Math.sin(time * 2 + i) * 15;
      ctx.fillStyle = i % 3 === 0 ? '#2ecc40' : '#6bef78';
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(time + i);
      ctx.fillRect(-4, -2, 8, 4);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  } else if (theme === 'office') {
    // Bookshelves and columns
    for (let i = 0; i < 10; i++) {
      const bx = i * 200 - (cameraX * 0.12) % (200 * 10);
      // Column
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.fillRect(bx, H - 180, 20, 130);
      ctx.fillRect(bx - 5, H - 185, 30, 8);
      ctx.fillRect(bx - 5, H - 52, 30, 8);
      // Bookshelf between columns
      ctx.fillStyle = 'rgba(52,152,219,0.04)';
      ctx.fillRect(bx + 30, H - 160, 120, 105);
      // Books
      const bookColors = ['rgba(231,77,60,0.08)','rgba(52,152,219,0.08)','rgba(46,204,64,0.08)','rgba(232,119,34,0.08)'];
      for (let shelf = 0; shelf < 3; shelf++) {
        for (let b = 0; b < 7; b++) {
          ctx.fillStyle = bookColors[(b + shelf) % bookColors.length];
          const bookW = 10 + (b * 3) % 8;
          ctx.fillRect(bx + 35 + b * 16, H - 155 + shelf * 35, bookW, 28);
        }
      }
    }
    // Clock
    const clockX = W / 2 - (cameraX * 0.05) % 100;
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(clockX, 60, 25, 0, Math.PI * 2);
    ctx.stroke();
    // Clock hands
    ctx.beginPath();
    ctx.moveTo(clockX, 60);
    ctx.lineTo(clockX + Math.cos(time * 0.5) * 15, 60 + Math.sin(time * 0.5) * 15);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(clockX, 60);
    ctx.lineTo(clockX + Math.cos(time * 3) * 20, 60 + Math.sin(time * 3) * 20);
    ctx.stroke();
  } else if (theme === 'community') {
    // Festive: floating hearts, stars, confetti
    ctx.globalAlpha = 0.08;
    for (let i = 0; i < 20; i++) {
      const sx = ((i * 170 + 40) - (cameraX * 0.1)) % (W + 200);
      const sy = (i * 67 + 20) % (H - 100);
      const s = 8 + (i % 5) * 3;
      ctx.fillStyle = ['#9b59b6','#e87722','#2ecc40','#3498db','#e74c3c'][i % 5];
      if (i % 3 === 0) {
        // Star
        drawStar(ctx, sx, sy + Math.sin(time + i) * 8, s, 5);
        ctx.fill();
      } else if (i % 3 === 1) {
        // Heart
        drawHeart(ctx, sx, sy + Math.sin(time * 0.8 + i) * 6, s);
        ctx.fill();
      } else {
        // Circle confetti
        ctx.beginPath();
        ctx.arc(sx, sy + Math.sin(time * 1.2 + i) * 10, s * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    // Bunting/banner
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 50);
    for (let x = 0; x <= W; x += 60) {
      ctx.lineTo(x, 50 + Math.sin((x - cameraX * 0.1) * 0.03) * 15);
    }
    ctx.stroke();
    // Flags on the bunting
    for (let x = 15; x <= W; x += 60) {
      const by = 50 + Math.sin((x - cameraX * 0.1) * 0.03) * 15;
      ctx.fillStyle = x % 120 < 60 ? 'rgba(232,119,34,0.08)' : 'rgba(155,89,182,0.08)';
      ctx.beginPath();
      ctx.moveTo(x - 8, by);
      ctx.lineTo(x + 8, by);
      ctx.lineTo(x, by + 18);
      ctx.closePath();
      ctx.fill();
    }
  }

  // Stars/dots in all themes
  ctx.globalAlpha = 0.2;
  for (let i = 0; i < 20; i++) {
    const x = ((i * 137 + 50) % W + W - (cameraX * 0.08) % W) % W;
    const y = (i * 89 + 20) % (H * 0.4);
    const s = 1 + (i % 2);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x, y, s, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawStar(ctx, cx, cy, r, points) {
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const radius = i % 2 === 0 ? r : r * 0.4;
    const angle = (i * Math.PI) / points - Math.PI / 2;
    if (i === 0) ctx.moveTo(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
    else ctx.lineTo(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
  }
  ctx.closePath();
}

function drawHeart(ctx, cx, cy, size) {
  ctx.beginPath();
  ctx.moveTo(cx, cy + size * 0.3);
  ctx.bezierCurveTo(cx, cy - size * 0.3, cx - size, cy - size * 0.3, cx - size, cy + size * 0.1);
  ctx.bezierCurveTo(cx - size, cy + size * 0.6, cx, cy + size, cx, cy + size);
  ctx.bezierCurveTo(cx, cy + size, cx + size, cy + size * 0.6, cx + size, cy + size * 0.1);
  ctx.bezierCurveTo(cx + size, cy - size * 0.3, cx, cy - size * 0.3, cx, cy + size * 0.3);
  ctx.closePath();
}

function drawPlatforms(lv) {
  const theme = lv.theme || 'city';
  for (const p of levelPlatforms) {
    // Main platform
    const pg = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
    pg.addColorStop(0, lv.color1);
    pg.addColorStop(1, lv.color2);
    ctx.fillStyle = pg;
    roundRect(ctx, p.x, p.y, p.w, p.h, 6);
    ctx.fill();

    // Top highlight
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(p.x + 4, p.y + 2, p.w - 8, 3);

    // Theme-specific platform details
    if (theme === 'city' && p.h > TILE) {
      // Brick pattern
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      for (let by = p.y + 12; by < p.y + p.h - 4; by += 10) {
        const offset = ((by - p.y) / 10) % 2 === 0 ? 0 : 12;
        for (let bx = p.x + 4 + offset; bx < p.x + p.w - 4; bx += 24) {
          ctx.fillRect(bx, by, 20, 1);
        }
      }
    } else if (theme === 'nature') {
      // Grass on top
      ctx.fillStyle = 'rgba(100,255,100,0.25)';
      for (let gx = p.x + 4; gx < p.x + p.w - 4; gx += 8) {
        const gh = 4 + Math.sin(gx * 0.3) * 2;
        ctx.fillRect(gx, p.y - gh, 3, gh);
      }
      // Dirt texture
      if (p.h > TILE) {
        ctx.fillStyle = 'rgba(0,0,0,0.06)';
        for (let i = 0; i < 6; i++) {
          const dx = p.x + 10 + ((i * 37) % (p.w - 20));
          const dy = p.y + 15 + ((i * 23) % (p.h - 20));
          ctx.beginPath();
          ctx.arc(dx, dy, 2 + i % 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    } else if (theme === 'office') {
      // Steel/concrete look with horizontal lines
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      for (let ly = p.y + 8; ly < p.y + p.h; ly += 12) {
        ctx.fillRect(p.x + 2, ly, p.w - 4, 1);
      }
      // Bolts at edges
      if (p.w > TILE * 2) {
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.arc(p.x + 8, p.y + 8, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(p.x + p.w - 8, p.y + 8, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (theme === 'community') {
      // Rainbow shimmer on top
      const colors = ['#e74c3c','#e87722','#f1c40f','#2ecc40','#3498db','#9b59b6'];
      const segW = p.w / colors.length;
      ctx.globalAlpha = 0.15;
      for (let ci = 0; ci < colors.length; ci++) {
        ctx.fillStyle = colors[ci];
        ctx.fillRect(p.x + ci * segW, p.y, segW + 1, 4);
      }
      ctx.globalAlpha = 1;
    } else {
      // Default decoration
      if (p.h > TILE) {
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        for (let gx = p.x + 8; gx < p.x + p.w - 8; gx += 16) {
          ctx.fillRect(gx, p.y - 2, 8, 4);
        }
      }
    }
  }
}

function drawHazards(lv) {
  const theme = lv.theme || 'city';
  const time = animFrame * 0.05;

  for (const h of levelHazards) {
    if (theme === 'city') {
      // Red tape / bureaucracy barriers
      ctx.fillStyle = '#cc3333';
      ctx.fillRect(h.x, h.y + 4, h.w, h.h - 4);
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(h.x, h.y + 8, h.w, 6);
      // Caution stripes
      ctx.fillStyle = 'rgba(255,255,0,0.4)';
      for (let sx = h.x; sx < h.x + h.w; sx += 16) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(h.x, h.y, h.w, h.h);
        ctx.clip();
        ctx.translate(sx, h.y);
        ctx.rotate(0.5);
        ctx.fillRect(0, 0, 6, h.h * 2);
        ctx.restore();
      }
      // Glow
      ctx.fillStyle = 'rgba(255,68,68,0.2)';
      ctx.fillRect(h.x, h.y - 4, h.w, h.h + 4);
    } else if (theme === 'nature') {
      // Toxic waste puddles
      ctx.fillStyle = 'rgba(100,50,0,0.6)';
      ctx.beginPath();
      ctx.ellipse(h.x + h.w / 2, h.y + h.h - 4, h.w / 2 + 4, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#88cc00';
      ctx.beginPath();
      ctx.ellipse(h.x + h.w / 2, h.y + h.h - 6, h.w / 2, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      // Bubbles
      ctx.fillStyle = 'rgba(200,255,0,0.5)';
      for (let b = 0; b < 3; b++) {
        const bx = h.x + 10 + (b * h.w / 3);
        const by = h.y + h.h - 10 - Math.abs(Math.sin(time + b * 2)) * 12;
        ctx.beginPath();
        ctx.arc(bx, by, 3 + Math.sin(time + b) * 1, 0, Math.PI * 2);
        ctx.fill();
      }
      // Skull
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('\u2620', h.x + h.w / 2, h.y + h.h - 6);
    } else if (theme === 'office') {
      // Paper shredder
      ctx.fillStyle = '#667';
      roundRect(ctx, h.x + 2, h.y, h.w - 4, h.h - 4, 4);
      ctx.fill();
      ctx.fillStyle = '#556';
      ctx.fillRect(h.x + 6, h.y + 2, h.w - 12, 8);
      // Slot
      ctx.fillStyle = '#333';
      ctx.fillRect(h.x + 10, h.y + 2, h.w - 20, 4);
      // Spinning blade indicator
      ctx.strokeStyle = 'rgba(255,100,100,0.6)';
      ctx.lineWidth = 2;
      const cx = h.x + h.w / 2;
      const cy = h.y + h.h / 2 + 4;
      for (let b = 0; b < 4; b++) {
        const angle = time * 3 + b * Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(angle) * 10, cy + Math.sin(angle) * 10);
        ctx.stroke();
      }
      // Red glow
      ctx.fillStyle = 'rgba(255,60,60,0.15)';
      ctx.fillRect(h.x, h.y - 2, h.w, h.h + 2);
    } else if (theme === 'community') {
      // Dark negativity clouds
      ctx.fillStyle = 'rgba(60,20,60,0.7)';
      const cx = h.x + h.w / 2;
      const cy = h.y + h.h / 2;
      ctx.beginPath();
      ctx.ellipse(cx, cy, h.w / 2 + 6, h.h / 2 + 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(80,30,80,0.5)';
      ctx.beginPath();
      ctx.ellipse(cx - h.w * 0.2, cy - 4, h.w * 0.3, h.h * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx + h.w * 0.2, cy - 2, h.w * 0.3, h.h * 0.35, 0, 0, Math.PI * 2);
      ctx.fill();
      // Angry face
      ctx.fillStyle = 'rgba(255,100,100,0.4)';
      ctx.font = '16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('\u2639', cx, cy + 5);
    } else {
      // Default spikes
      ctx.fillStyle = '#ff4444';
      for (let i = 0; i < h.w / 20; i++) {
        const sx = h.x + i * 20;
        ctx.beginPath();
        ctx.moveTo(sx, h.y + h.h);
        ctx.lineTo(sx + 10, h.y);
        ctx.lineTo(sx + 20, h.y + h.h);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,68,68,0.3)';
      ctx.fillRect(h.x, h.y - 4, h.w, h.h + 4);
    }
  }
}

function drawCollectibles(lv) {
  const time = animFrame * 0.05;
  for (const c of levelCollectibles) {
    if (c.collected) continue;
    const bob = Math.sin(time + c.x * 0.1) * 4;
    const cy = c.y + bob;

    if (c.type === 'coin') {
      // Golden coin
      const cg = ctx.createRadialGradient(c.x, cy, 2, c.x, cy, 12);
      cg.addColorStop(0, '#FFE66D');
      cg.addColorStop(1, '#FFB800');
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.arc(c.x, cy, 12, 0, Math.PI * 2);
      ctx.fill();
      // Shine
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      ctx.arc(c.x - 3, cy - 3, 4, 0, Math.PI * 2);
      ctx.fill();
      // B label
      ctx.fillStyle = '#996600';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('B', c.x, cy + 1);
    } else if (c.type === 'fact') {
      // Knowledge orb
      ctx.shadowColor = lv.color1;
      ctx.shadowBlur = 15;
      const fg = ctx.createRadialGradient(c.x, cy, 4, c.x, cy, 18);
      fg.addColorStop(0, '#fff');
      fg.addColorStop(0.4, lv.color1);
      fg.addColorStop(1, lv.color2);
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.arc(c.x, cy, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      // Icon
      ctx.fillStyle = '#fff';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('?', c.x, cy + 1);
      // Rotating ring
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(c.x, cy, 20, time % (Math.PI*2), time % (Math.PI*2) + Math.PI);
      ctx.stroke();
    }
  }
}

function drawFinish(lv) {
  const time = animFrame * 0.03;
  const fx = levelFinish.x;
  const fy = levelFinish.y;

  // Flag pole
  ctx.fillStyle = '#ddd';
  ctx.fillRect(fx + TILE/2 - 2, fy - 40, 4, 60);

  // Flag
  ctx.fillStyle = lv.color1;
  ctx.beginPath();
  ctx.moveTo(fx + TILE/2 + 2, fy - 38);
  ctx.lineTo(fx + TILE/2 + 30 + Math.sin(time) * 4, fy - 28);
  ctx.lineTo(fx + TILE/2 + 2, fy - 18);
  ctx.closePath();
  ctx.fill();

  // Star
  ctx.fillStyle = '#FFD700';
  ctx.font = '20px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('★', fx + TILE/2, fy - 48 + Math.sin(time * 2) * 3);

  // Glow at base
  ctx.fillStyle = `rgba(255,215,0,${0.2 + Math.sin(time * 3) * 0.1})`;
  ctx.beginPath();
  ctx.arc(fx + TILE/2, fy + 10, 25, 0, Math.PI * 2);
  ctx.fill();
}

function drawDriessenFox(px, py, f, walk, isWalking, isAir, isDying, blink) {
  // Shadow
  if (player.onGround && !isDying) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(15, player.h + 2, 12, 3, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // --- TAIL (behind body) ---
  ctx.save();
  const tailWag = isWalking ? Math.sin(walk * 6) * 0.3 : Math.sin(animFrame * 0.03) * 0.1;
  ctx.translate(2, 18);
  ctx.rotate(-0.6 + tailWag);
  // Main tail
  ctx.fillStyle = '#e87722';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-12, -6, -10, -18);
  ctx.quadraticCurveTo(-8, -22, -4, -18);
  ctx.quadraticCurveTo(-2, -10, 0, 0);
  ctx.fill();
  // White tail tip
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(-7, -18, 4, 4, -0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // --- LEGS ---
  ctx.fillStyle = '#8B4513';
  const legW = 5, legH = 7;
  if (isWalking && !isAir && !isDying) {
    ctx.save();
    ctx.translate(8, 28);
    ctx.rotate(walk * 0.4);
    roundRect(ctx, -2, 0, legW, legH, 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#8B4513';
    ctx.save();
    ctx.translate(20, 28);
    ctx.rotate(-walk * 0.4);
    roundRect(ctx, -2, 0, legW, legH, 2); ctx.fill();
    ctx.restore();
  } else if (isAir) {
    ctx.save();
    ctx.translate(8, 28);
    ctx.rotate(-0.35);
    roundRect(ctx, -2, 0, legW, legH - 1, 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#8B4513';
    ctx.save();
    ctx.translate(20, 28);
    ctx.rotate(0.35);
    roundRect(ctx, -2, 0, legW, legH - 1, 2); ctx.fill();
    ctx.restore();
  } else {
    roundRect(ctx, 6, 28, legW, legH, 2); ctx.fill();
    roundRect(ctx, 18, 28, legW, legH, 2); ctx.fill();
  }

  // --- BODY ---
  // Orange fur body
  const bodyGrad = ctx.createRadialGradient(15, 20, 2, 15, 20, 14);
  bodyGrad.addColorStop(0, '#f5a030');
  bodyGrad.addColorStop(1, '#e87722');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(15, 20, 12, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  // White belly
  ctx.fillStyle = '#FFF5E6';
  ctx.beginPath();
  ctx.ellipse(17, 22, 7, 7, 0.1, 0, Math.PI * 2);
  ctx.fill();

  // --- HEAD ---
  // Orange head
  const headGrad = ctx.createRadialGradient(15, 6, 2, 15, 6, 12);
  headGrad.addColorStop(0, '#f5a030');
  headGrad.addColorStop(1, '#e87722');
  ctx.fillStyle = headGrad;
  ctx.beginPath();
  ctx.ellipse(15, 6, 12, 11, 0, 0, Math.PI * 2);
  ctx.fill();

  // White face/cheeks
  ctx.fillStyle = '#FFF5E6';
  ctx.beginPath();
  ctx.ellipse(17, 9, 8, 6, 0.1, 0, Math.PI * 2);
  ctx.fill();

  // --- EARS ---
  // Left ear (pointy triangle)
  ctx.fillStyle = '#e87722';
  ctx.beginPath();
  ctx.moveTo(5, 2);
  ctx.lineTo(1, -10);
  ctx.lineTo(11, -1);
  ctx.closePath();
  ctx.fill();
  // Left ear inner (pink)
  ctx.fillStyle = '#FFB6C1';
  ctx.beginPath();
  ctx.moveTo(5.5, 0);
  ctx.lineTo(3, -7);
  ctx.lineTo(9, -1);
  ctx.closePath();
  ctx.fill();

  // Right ear
  ctx.fillStyle = '#e87722';
  ctx.beginPath();
  ctx.moveTo(24, 1);
  ctx.lineTo(26, -10);
  ctx.lineTo(29, 0);
  ctx.closePath();
  ctx.fill();
  // Right ear inner
  ctx.fillStyle = '#FFB6C1';
  ctx.beginPath();
  ctx.moveTo(24.5, -0.5);
  ctx.lineTo(26, -7);
  ctx.lineTo(28, -0.5);
  ctx.closePath();
  ctx.fill();

  // === EYES ===
  if (isDying) {
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(10, 3); ctx.lineTo(13, 6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(13, 3); ctx.lineTo(10, 6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(19, 3); ctx.lineTo(22, 6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(22, 3); ctx.lineTo(19, 6); ctx.stroke();
  } else if (blink) {
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(9, 4.5); ctx.lineTo(14, 4.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(19, 4.5); ctx.lineTo(24, 4.5); ctx.stroke();
  } else {
    // Left eye
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(11, 4, 3.5, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2E8B57';
    ctx.beginPath();
    ctx.arc(12, 4, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(12.3, 4, 1.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(12.8, 3, 0.6, 0, Math.PI * 2);
    ctx.fill();

    // Right eye
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(21, 4, 3.5, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2E8B57';
    ctx.beginPath();
    ctx.arc(22, 4, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(22.3, 4, 1.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(22.8, 3, 0.6, 0, Math.PI * 2);
    ctx.fill();
  }

  // --- NOSE ---
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.ellipse(17, 8, 2.5, 2, 0, 0, Math.PI * 2);
  ctx.fill();
  // Nose shine
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath();
  ctx.ellipse(17.5, 7.3, 1, 0.7, 0, 0, Math.PI * 2);
  ctx.fill();

  // --- MOUTH ---
  if (isDying) {
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.ellipse(17, 12, 2, 2, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (isAir) {
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.ellipse(17, 11, 2, 1.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FF6B6B';
    ctx.beginPath();
    ctx.ellipse(17, 11.3, 1.3, 0.8, 0, 0, Math.PI);
    ctx.fill();
  } else {
    // Cute W-shaped fox mouth
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(14, 10);
    ctx.quadraticCurveTo(15.5, 12, 17, 10);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(17, 10);
    ctx.quadraticCurveTo(18.5, 12, 20, 10);
    ctx.stroke();
  }

  // Whiskers
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 0.8;
  // Left whiskers
  ctx.beginPath(); ctx.moveTo(8, 8); ctx.lineTo(-1, 6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(8, 9.5); ctx.lineTo(-1, 10); ctx.stroke();
  // Right whiskers
  ctx.beginPath(); ctx.moveTo(25, 8); ctx.lineTo(32, 6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(25, 9.5); ctx.lineTo(32, 10); ctx.stroke();

  // Driessen "D" badge on chest
  ctx.fillStyle = 'rgba(0,51,102,0.5)';
  ctx.beginPath();
  ctx.arc(17, 21, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 4px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('D', 17, 21.5);
}

function drawPlayer(lv) {
  const px = player.x;
  const py = player.y;
  const f = player.facing;
  const charType = selectedChar || 'man';

  ctx.save();
  ctx.translate(px + player.w/2, py + player.h/2);
  ctx.scale(f, 1);
  ctx.translate(-(player.w/2), -(player.h/2));

  const walk = Math.sin(player.walkFrame * 4);
  const isWalking = Math.abs(player.vx) > 0.5;
  const isAir = !player.onGround;
  const isDying = deathTimer > 0;
  const blink = Math.floor(animFrame / 60) % 4 === 0 && Math.floor(animFrame % 60) < 4;

  // Fox character: completely different sprite
  if (charType === 'driessen') {
    if (isDying) ctx.globalAlpha = 0.3 + Math.sin(deathTimer * 0.5) * 0.4;
    drawDriessenFox(px, py, f, walk, isWalking, isAir, isDying, blink);
    ctx.globalAlpha = 1;
    ctx.restore();
    return;
  }

  // Character config
  const isVrouw = charType === 'vrouw';
  const isDriessen = false;
  const hairColor1 = isVrouw ? '#C8841A' : isDriessen ? '#4A2810' : '#4A2810';
  const hairColor2 = isVrouw ? '#A06810' : isDriessen ? '#3A1E08' : '#3A1E08';
  const shirtColor1 = isDriessen ? '#003366' : '#f08830';
  const shirtColor2 = isDriessen ? '#002244' : '#d06a18';
  const pantsColor = isVrouw ? '#1a1a2e' : '#003366';
  const shoeColor = isVrouw ? '#8B1A1A' : '#222';
  const irisColor = isVrouw ? '#6B4226' : isDriessen ? '#2E8B57' : '#2962A0';

  // Death flash effect
  if (isDying) {
    ctx.globalAlpha = 0.3 + Math.sin(deathTimer * 0.5) * 0.4;
  }

  // Shadow
  if (player.onGround && !isDying) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(player.w/2, player.h + 2, 12, 3, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // --- LEGS ---
  const legW = 7, legH = 9;

  if (isVrouw) {
    // Skirt
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath();
    ctx.moveTo(4, 26);
    ctx.lineTo(26, 26);
    ctx.lineTo(28, 32);
    ctx.lineTo(2, 32);
    ctx.closePath();
    ctx.fill();
    // Skirt highlight
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath();
    ctx.moveTo(10, 26);
    ctx.lineTo(13, 32);
    ctx.lineTo(16, 26);
    ctx.closePath();
    ctx.fill();
    // Legs under skirt (thinner)
    ctx.fillStyle = '#F0B860';
    if (isWalking && !isAir && !isDying) {
      ctx.save();
      ctx.translate(10, 31);
      ctx.rotate(walk * 0.3);
      ctx.fillRect(-2, 0, 5, 5);
      ctx.fillStyle = shoeColor;
      roundRect(ctx, -3, 3, 7, 3, 1); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#F0B860';
      ctx.save();
      ctx.translate(19, 31);
      ctx.rotate(-walk * 0.3);
      ctx.fillRect(-2, 0, 5, 5);
      ctx.fillStyle = shoeColor;
      roundRect(ctx, -3, 3, 7, 3, 1); ctx.fill();
      ctx.restore();
    } else if (isAir) {
      ctx.save();
      ctx.translate(10, 31);
      ctx.rotate(-0.3);
      ctx.fillRect(-2, 0, 5, 4);
      ctx.fillStyle = shoeColor;
      roundRect(ctx, -3, 3, 7, 3, 1); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#F0B860';
      ctx.save();
      ctx.translate(19, 31);
      ctx.rotate(0.3);
      ctx.fillRect(-2, 0, 5, 4);
      ctx.fillStyle = shoeColor;
      roundRect(ctx, -3, 3, 7, 3, 1); ctx.fill();
      ctx.restore();
    } else {
      ctx.fillRect(8, 31, 5, 5);
      ctx.fillRect(17, 31, 5, 5);
      ctx.fillStyle = shoeColor;
      roundRect(ctx, 7, 34, 7, 3, 1); ctx.fill();
      roundRect(ctx, 16, 34, 7, 3, 1); ctx.fill();
    }
  } else {
    // Pants for man/driessen
    ctx.fillStyle = pantsColor;
    if (isWalking && !isAir && !isDying) {
      ctx.save();
      ctx.translate(8, 27);
      ctx.rotate(walk * 0.35);
      roundRect(ctx, -3, 0, legW, legH, 2); ctx.fill();
      ctx.fillStyle = shoeColor;
      roundRect(ctx, -4, legH - 3, legW + 2, 4, 2); ctx.fill();
      ctx.restore();
      ctx.fillStyle = pantsColor;
      ctx.save();
      ctx.translate(20, 27);
      ctx.rotate(-walk * 0.35);
      roundRect(ctx, -3, 0, legW, legH, 2); ctx.fill();
      ctx.fillStyle = shoeColor;
      roundRect(ctx, -4, legH - 3, legW + 2, 4, 2); ctx.fill();
      ctx.restore();
    } else if (isAir) {
      ctx.save();
      ctx.translate(8, 27);
      ctx.rotate(-0.4);
      roundRect(ctx, -3, 0, legW, legH - 1, 2); ctx.fill();
      ctx.fillStyle = shoeColor;
      roundRect(ctx, -4, legH - 4, legW + 2, 4, 2); ctx.fill();
      ctx.restore();
      ctx.fillStyle = pantsColor;
      ctx.save();
      ctx.translate(20, 27);
      ctx.rotate(0.4);
      roundRect(ctx, -3, 0, legW, legH - 1, 2); ctx.fill();
      ctx.fillStyle = shoeColor;
      roundRect(ctx, -4, legH - 4, legW + 2, 4, 2); ctx.fill();
      ctx.restore();
    } else {
      roundRect(ctx, 5, 27, legW, legH, 2); ctx.fill();
      roundRect(ctx, 17, 27, legW, legH, 2); ctx.fill();
      ctx.fillStyle = shoeColor;
      roundRect(ctx, 4, 33, legW + 2, 4, 2); ctx.fill();
      roundRect(ctx, 16, 33, legW + 2, 4, 2); ctx.fill();
    }
  }

  // --- BODY ---
  const bodyGrad = ctx.createLinearGradient(4, 12, 4, 28);
  bodyGrad.addColorStop(0, shirtColor1);
  bodyGrad.addColorStop(1, shirtColor2);
  ctx.fillStyle = bodyGrad;
  roundRect(ctx, 4, 13, 22, isVrouw ? 14 : 15, 5);
  ctx.fill();

  // Collar
  if (isDriessen) {
    // White collar (business)
    ctx.fillStyle = '#ddd';
    ctx.beginPath();
    ctx.moveTo(10, 13); ctx.lineTo(15, 16); ctx.lineTo(20, 13);
    ctx.lineTo(18, 12); ctx.lineTo(15, 14); ctx.lineTo(12, 12);
    ctx.closePath();
    ctx.fill();
    // Tie
    ctx.fillStyle = '#e87722';
    ctx.beginPath();
    ctx.moveTo(14, 15); ctx.lineTo(16, 15); ctx.lineTo(16.5, 23);
    ctx.lineTo(15, 24); ctx.lineTo(13.5, 23);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.fillStyle = isVrouw ? '#f8b060' : '#f5a050';
    ctx.beginPath();
    ctx.moveTo(10, 13); ctx.lineTo(15, 16); ctx.lineTo(20, 13);
    ctx.lineTo(18, 12); ctx.lineTo(15, 14); ctx.lineTo(12, 12);
    ctx.closePath();
    ctx.fill();
  }

  // B-Corp badge (not on driessen - has tie)
  if (!isDriessen) {
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.arc(22, 18, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = shirtColor2;
    ctx.font = 'bold 5px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('B', 22, 18.5);
  }

  // --- ARMS ---
  const armColor1 = isDriessen ? '#002244' : isVrouw ? '#F0B860' : shirtColor1;
  const armColor2 = isDriessen ? '#001a33' : isVrouw ? '#F0B860' : shirtColor2;
  const handColor = '#FDBF60';

  // Back arm
  ctx.fillStyle = armColor2;
  if (isWalking && !isAir && !isDying) {
    ctx.save();
    ctx.translate(6, 15);
    ctx.rotate(-walk * 0.5);
    roundRect(ctx, -2, 0, 6, 12, 3); ctx.fill();
    ctx.fillStyle = handColor;
    ctx.beginPath(); ctx.arc(1, 12, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  } else if (isAir) {
    ctx.save();
    ctx.translate(6, 15);
    ctx.rotate(0.6);
    roundRect(ctx, -2, 0, 6, 11, 3); ctx.fill();
    ctx.fillStyle = handColor;
    ctx.beginPath(); ctx.arc(1, 11, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Front arm
  ctx.fillStyle = armColor1;
  if (isWalking && !isAir && !isDying) {
    ctx.save();
    ctx.translate(22, 15);
    ctx.rotate(walk * 0.5);
    roundRect(ctx, -2, 0, 6, 12, 3); ctx.fill();
    ctx.fillStyle = handColor;
    ctx.beginPath(); ctx.arc(1, 12, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  } else if (isAir) {
    ctx.save();
    ctx.translate(22, 14);
    ctx.rotate(-0.8);
    roundRect(ctx, -2, -2, 6, 12, 3); ctx.fill();
    ctx.fillStyle = handColor;
    ctx.beginPath(); ctx.arc(1, 9, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  } else {
    ctx.save();
    ctx.translate(22, 15);
    roundRect(ctx, -1, 0, 6, 11, 3); ctx.fill();
    ctx.fillStyle = handColor;
    ctx.beginPath(); ctx.arc(2, 11, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // --- HEAD ---
  ctx.fillStyle = '#F0B860';
  ctx.fillRect(12, 9, 6, 5);

  const headGrad = ctx.createRadialGradient(15, 6, 1, 15, 6, 11);
  headGrad.addColorStop(0, '#FECE78');
  headGrad.addColorStop(1, '#EDAA40');
  ctx.fillStyle = headGrad;
  ctx.beginPath();
  ctx.ellipse(15, 5, 11, 10, 0, 0, Math.PI * 2);
  ctx.fill();

  // === CHARACTER-SPECIFIC HAIR ===
  if (isVrouw) {
    // Blonde/golden long hair
    ctx.fillStyle = hairColor1;
    // Top hair, fuller
    ctx.beginPath();
    ctx.ellipse(15, 1, 12.5, 9, 0, Math.PI * 0.75, Math.PI * 2.25);
    ctx.fill();
    // Side flowing hair (left = back of head)
    ctx.fillStyle = hairColor1;
    ctx.beginPath();
    ctx.moveTo(3, -2);
    ctx.quadraticCurveTo(-2, 5, -1, 20);
    ctx.quadraticCurveTo(0, 24, 4, 22);
    ctx.quadraticCurveTo(7, 15, 6, 0);
    ctx.closePath();
    ctx.fill();
    // Side flowing hair (right = front)
    ctx.beginPath();
    ctx.moveTo(25, 2);
    ctx.quadraticCurveTo(28, 8, 27, 16);
    ctx.quadraticCurveTo(26, 18, 24, 14);
    ctx.quadraticCurveTo(23, 8, 25, 2);
    ctx.closePath();
    ctx.fill();
    // Hair highlight
    ctx.fillStyle = '#DDA030';
    ctx.beginPath();
    ctx.ellipse(15, -1, 8, 4, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    // Hair band
    ctx.fillStyle = '#e87722';
    ctx.fillRect(3, 1, 24, 2.5);
  } else if (isDriessen) {
    // Driessen blue cap
    ctx.fillStyle = '#003366';
    ctx.beginPath();
    ctx.ellipse(15, 0, 13, 9, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(2, 0, 26, 5);
    // Cap brim (front)
    ctx.fillStyle = '#002244';
    ctx.beginPath();
    ctx.moveTo(15, 4);
    ctx.lineTo(30, 5);
    ctx.quadraticCurveTo(32, 7, 28, 8);
    ctx.lineTo(15, 6);
    ctx.closePath();
    ctx.fill();
    // Orange D on cap
    ctx.fillStyle = '#e87722';
    ctx.font = 'bold 9px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('D', 15, -1);
    // Short hair under cap
    ctx.fillStyle = '#4A2810';
    ctx.beginPath();
    ctx.ellipse(5, 5, 3, 5, 0.2, Math.PI * 0.3, Math.PI * 1.2);
    ctx.fill();
  } else {
    // Man: short brown hair, slightly spiky
    ctx.fillStyle = '#4A2810';
    ctx.beginPath();
    ctx.ellipse(15, 1, 12, 9, 0, Math.PI * 0.8, Math.PI * 2.2);
    ctx.fill();
    // Side hair
    ctx.beginPath();
    ctx.ellipse(4, 4, 3.5, 6, 0.2, 0, Math.PI * 2);
    ctx.fill();
    // Hair top detail
    ctx.fillStyle = '#3A1E08';
    ctx.beginPath();
    ctx.ellipse(15, -1, 9, 5, 0, Math.PI * 0.85, Math.PI * 2.15);
    ctx.fill();
    // Subtle stubble/shadow on chin
    ctx.fillStyle = 'rgba(60,40,20,0.1)';
    ctx.beginPath();
    ctx.ellipse(19, 12, 5, 3, 0, 0, Math.PI);
    ctx.fill();
  }

  // Ear
  if (!isDriessen || true) {
    ctx.fillStyle = '#EDAA40';
    ctx.beginPath();
    ctx.ellipse(isDriessen ? 4 : 5, 6, 3, isDriessen ? 3 : 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#D09030';
    ctx.beginPath();
    ctx.ellipse(isDriessen ? 4.5 : 5.5, 6, 1.5, isDriessen ? 1.5 : 2.5, 0, 0, Math.PI * 2);
    ctx.fill();
    // Earring for vrouw
    if (isVrouw) {
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.arc(5, 10.5, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // === EYES ===
  if (isDying) {
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(16, 4); ctx.lineTo(19, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(19, 4); ctx.lineTo(16, 7); ctx.stroke();
  } else if (blink) {
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(16, 5.5); ctx.lineTo(21, 5.5); ctx.stroke();
    // Eyelashes for vrouw even when blinking
    if (isVrouw) {
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(15.5, 5); ctx.lineTo(14.5, 3.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(21.5, 5); ctx.lineTo(22.5, 3.5); ctx.stroke();
    }
  } else {
    // Eye white
    ctx.fillStyle = '#fff';
    const eyeH = isVrouw ? 3.8 : 3.5;
    ctx.beginPath();
    ctx.ellipse(18.5, 5.5, 4, eyeH, 0, 0, Math.PI * 2);
    ctx.fill();
    // Iris
    ctx.fillStyle = irisColor;
    ctx.beginPath();
    ctx.arc(19.5, 5.5, 2.2, 0, Math.PI * 2);
    ctx.fill();
    // Pupil
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(19.8, 5.5, 1.2, 0, Math.PI * 2);
    ctx.fill();
    // Shine
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(20.3, 4.5, 0.7, 0, Math.PI * 2);
    ctx.fill();
    // Eyelashes for vrouw
    if (isVrouw) {
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(15, 4); ctx.lineTo(13.5, 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(16, 3.5); ctx.lineTo(15, 1.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(21.5, 3.5); ctx.lineTo(23, 2); ctx.stroke();
    }
    // Eyebrow
    ctx.strokeStyle = isVrouw ? hairColor2 : '#3A1E08';
    ctx.lineWidth = isVrouw ? 1.3 : 1.8;
    ctx.beginPath();
    ctx.moveTo(15, isAir ? 1.5 : 2.5);
    ctx.quadraticCurveTo(18, isAir ? 0 : 1.5, 22, isAir ? 1.5 : 2.5);
    ctx.stroke();
  }

  // === MOUTH ===
  if (isDying) {
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.ellipse(19, 10, 2, 2.5, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (isAir) {
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.ellipse(19.5, 10, 2.5, 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#c0392b';
    ctx.beginPath();
    ctx.ellipse(19.5, 10.3, 1.8, 1.2, 0, 0, Math.PI);
    ctx.fill();
  } else {
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(18, 9, 4, 0.1, Math.PI * 0.6);
    ctx.stroke();
    if (isVrouw) {
      // Lips
      ctx.fillStyle = 'rgba(200,80,80,0.5)';
      ctx.beginPath();
      ctx.ellipse(19, 10.5, 3.5, 1.3, 0, 0, Math.PI);
      ctx.fill();
      // Blush
      ctx.fillStyle = 'rgba(255,100,120,0.25)';
      ctx.beginPath();
      ctx.ellipse(23, 8.5, 3, 2, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(255,120,80,0.12)';
      ctx.beginPath();
      ctx.ellipse(22, 8, 3, 2, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Nose
  ctx.fillStyle = '#EDAA40';
  ctx.beginPath();
  ctx.ellipse(21, 7, 1.2, 1, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ========================
// GAME LOOP
// ========================
function gameLoop() {
  animFrame++;

  if (gameState === 'playing') {
    if (deathTimer > 0) {
      deathTimer--;
      updateParticles(); // Keep particles animating during freeze
      if (deathTimer <= 0) {
        respawnPlayer();
      }
    } else {
      updatePlayer();
      updateParticles();
    }
    // Update timer in HUD every frame
    document.getElementById('hud-time').textContent = formatTime(getLevelElapsed());
  }

  render();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>B-Corp Quest - Driessen Groep</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #0a1628;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
#ui-layer {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 10;
}
#ui-layer > * { pointer-events: auto; }

/* Mobile Controls */
#mobile-controls {
  display: none;
  position: absolute;
  bottom: 10px;
  left: 0; right: 0;
  padding: 0 15px;
  z-index: 20;
}
.ctrl-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  width: 100%;
}
.ctrl-btn {
  width: 64px; height: 64px;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.15);
  color: #fff;
  font-size: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  transition: background 0.1s;
}
.ctrl-btn:active, .ctrl-btn.active {
  background: rgba(255,255,255,0.4);
}
.ctrl-left-group { display: flex; gap: 12px; }
.ctrl-right-group { display: flex; gap: 12px; }
#btn-jump { width: 80px; height: 80px; font-size: 32px; }

/* Screens */
.screen {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 30;
  transition: opacity 0.4s;
}
.screen.hidden { display: none; }

#start-screen {
  background: linear-gradient(135deg, #003366 0%, #005a9e 40%, #e87722 100%);
}
.logo-area {
  text-align: center;
  margin-bottom: 30px;
}
.logo-area h1 {
  font-size: 2.4em;
  color: #fff;
  text-shadow: 2px 2px 8px rgba(0,0,0,0.4);
  line-height: 1.2;
}
.logo-area h2 {
  font-size: 1.1em;
  color: rgba(255,255,255,0.85);
  font-weight: 400;
  margin-top: 8px;
}
.logo-bcorp {
  font-size: 4em;
  margin-bottom: 10px;
}
.start-btn, .menu-btn {
  padding: 16px 48px;
  font-size: 1.2em;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  font-weight: 700;
  margin: 8px;
  transition: transform 0.15s, box-shadow 0.15s;
}
.start-btn {
  background: #e87722;
  color: #fff;
  box-shadow: 0 4px 15px rgba(232,119,34,0.5);
}
.start-btn:hover, .start-btn:active {
  transform: scale(1.05);
  box-shadow: 0 6px 20px rgba(232,119,34,0.7);
}
.menu-btn {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border: 2px solid rgba(255,255,255,0.4);
  padding: 12px 36px;
  font-size: 1em;
}

/* Level Select */
#level-screen {
  background: linear-gradient(135deg, #003366 0%, #00498f 100%);
}
.level-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  padding: 20px;
  max-width: 400px;
  width: 100%;
}
.level-card {
  background: rgba(255,255,255,0.1);
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 16px;
  padding: 20px 16px;
  text-align: center;
  color: #fff;
  cursor: pointer;
  transition: transform 0.15s, background 0.15s;
}
.level-card:hover, .level-card:active {
  transform: scale(1.03);
  background: rgba(255,255,255,0.2);
}
.level-card.locked {
  opacity: 0.4;
  pointer-events: none;
}
.level-card.completed {
  opacity: 0.6;
  pointer-events: none;
  border-color: rgba(76,175,80,0.5);
  background: rgba(76,175,80,0.15);
}
.level-card .level-icon { font-size: 2.2em; margin-bottom: 8px; }
.level-card .level-name { font-size: 0.95em; font-weight: 700; }
.level-card .level-sub { font-size: 0.75em; opacity: 0.7; margin-top: 4px; }
.level-stars { margin-top: 6px; font-size: 1.1em; letter-spacing: 2px; }

/* HUD */
#hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: 10px 16px;
  display: none;
  justify-content: space-between;
  align-items: center;
  z-index: 15;
  background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 100%);
}
#hud .hud-left, #hud .hud-right { display: flex; align-items: center; gap: 12px; }
.hud-item {
  color: #fff;
  font-size: 0.9em;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 4px;
}
#btn-pause {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.15);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
}

/* Knowledge Popup */
#knowledge-popup {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: linear-gradient(135deg, #003366, #005a9e);
  border: 3px solid #e87722;
  border-radius: 20px;
  padding: 28px 24px;
  max-width: 340px;
  width: 85%;
  color: #fff;
  text-align: center;
  z-index: 40;
  display: none;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}
#knowledge-popup h3 {
  color: #e87722;
  margin-bottom: 12px;
  font-size: 1.15em;
}
#knowledge-popup p {
  font-size: 0.9em;
  line-height: 1.5;
  margin-bottom: 16px;
}
#knowledge-popup button {
  padding: 10px 32px;
  border: none;
  border-radius: 25px;
  background: #e87722;
  color: #fff;
  font-weight: 700;
  font-size: 1em;
  cursor: pointer;
}

/* Pause Overlay */
#pause-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,20,50,0.85);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 35;
  color: #fff;
}
#pause-overlay h2 { font-size: 2em; margin-bottom: 24px; }

/* Level Complete */
#level-complete {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,20,50,0.9);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 35;
  color: #fff;
}
#level-complete h2 { font-size: 1.8em; margin-bottom: 8px; }
#level-complete .stars { font-size: 2.5em; margin: 16px 0; }
#level-complete .summary {
  font-size: 0.95em;
  line-height: 1.6;
  max-width: 320px;
  text-align: center;
  margin-bottom: 24px;
  opacity: 0.9;
}
.btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

/* Intro overlay */
#level-intro {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,20,50,0.92);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 35;
  color: #fff;
  padding: 24px;
  text-align: center;
}
#level-intro .intro-icon { font-size: 3em; margin-bottom: 12px; }
#level-intro h2 { font-size: 1.6em; margin-bottom: 8px; }
#level-intro .intro-desc {
  font-size: 0.9em; line-height: 1.6;
  max-width: 340px; margin-bottom: 24px;
  opacity: 0.9;
}

@media (max-width: 600px) {
  .logo-area h1 { font-size: 1.8em; }
  .logo-bcorp { font-size: 3em; }
  .level-grid { gap: 10px; padding: 16px; }
  .level-card { padding: 14px 10px; }
  .ctrl-btn { width: 56px; height: 56px; font-size: 24px; }
  #btn-jump { width: 70px; height: 70px; }
  .char-grid { gap: 12px; }
  .char-card { padding: 14px 10px; min-height: 120px; }
  .char-card .char-preview { font-size: 2.5em; }
}

/* Character Select */
#char-screen {
  background: linear-gradient(135deg, #003366 0%, #005a9e 50%, #e87722 100%);
}
.char-grid {
  display: flex;
  gap: 16px;
  padding: 20px;
  max-width: 500px;
  width: 100%;
  justify-content: center;
}
.char-card {
  background: rgba(255,255,255,0.1);
  border: 3px solid rgba(255,255,255,0.2);
  border-radius: 16px;
  padding: 20px 16px;
  text-align: center;
  color: #fff;
  cursor: pointer;
  transition: transform 0.15s, background 0.15s, border-color 0.15s;
  flex: 1;
  min-height: 140px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.char-card:hover, .char-card:active {
  transform: scale(1.05);
  background: rgba(255,255,255,0.2);
}
.char-card.selected {
  border-color: #e87722;
  background: rgba(232,119,34,0.25);
}
.char-card .char-preview { font-size: 3em; margin-bottom: 8px; line-height: 1; }
.char-card .char-name { font-size: 0.95em; font-weight: 700; }
.hs-entry {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 12px; margin: 4px 0; border-radius: 8px;
  background: rgba(255,255,255,0.06); color: #fff; font-size: 0.9em;
}
.hs-entry:nth-child(1) { background: rgba(255,215,0,0.15); }
.hs-entry:nth-child(2) { background: rgba(192,192,192,0.12); }
.hs-entry:nth-child(3) { background: rgba(205,127,50,0.12); }
.hs-rank { color: #e87722; font-weight: bold; min-width: 28px; }
.hs-name { flex: 1; text-align: left; margin-left: 8px; }
.hs-score { color: #f5a030; font-weight: bold; }
.hs-new { animation: hs-glow 1s ease-in-out infinite alternate; }
@keyframes hs-glow { from { background: rgba(232,119,34,0.15); } to { background: rgba(232,119,34,0.35); } }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>

<div id="ui-layer">
  <!-- START SCREEN -->
  <div id="start-screen" class="screen">
    <div class="logo-area">
      <div class="logo-bcorp">&#127759;</div>
      <h1>B-Corp Quest</h1>
      <h2>Driessen Groep</h2>
    </div>
    <button class="start-btn" onclick="showLevelSelect()">Speel Nu!</button>
    <button class="menu-btn" onclick="showInfo()">Wat is B-Corp?</button>
    <button class="menu-btn" onclick="viewHighScores()">&#127942; Hall of Fame</button>
  </div>

  <!-- CHARACTER SELECT -->
  <div id="char-screen" class="screen hidden">
    <h2 style="color:#fff; margin-bottom:6px; font-size:1.4em;">Kies je karakter</h2>
    <p style="color:rgba(255,255,255,0.7); margin-bottom:16px; font-size:0.9em;">Wie wil jij zijn bij Driessen Groep?</p>
    <div class="char-grid">
      <div class="char-card" onclick="selectCharacter('man')">
        <div class="char-preview">&#128104;</div>
        <div class="char-name">Collega</div>
      </div>
      <div class="char-card" onclick="selectCharacter('vrouw')">
        <div class="char-preview">&#128105;</div>
        <div class="char-name">Collega</div>
      </div>
      <div class="char-card" onclick="selectCharacter('driessen')">
        <div class="char-preview">&#129418;</div>
        <div class="char-name">Fox-D</div>
      </div>
    </div>
    <button class="menu-btn" style="margin-top:16px;" onclick="showStart()">&#8592; Terug</button>
  </div>

  <!-- LEVEL SELECT -->
  <div id="level-screen" class="screen hidden">
    <h2 style="color:#fff; margin-bottom:20px; font-size:1.4em;">Kies een Level</h2>
    <div class="level-grid" id="level-grid"></div>
    <div style="display:flex; gap:10px; margin-top:16px;">
      <button class="menu-btn" onclick="showCharSelect()">&#128100; Karakter</button>
      <button class="menu-btn" onclick="showStart()">&#8592; Terug</button>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-left">
      <button id="btn-pause" onclick="togglePause()">&#10074;&#10074;</button>
      <span class="hud-item" id="hud-level">Level 1</span>
    </div>
    <div class="hud-right">
      <span class="hud-item">&#9200; <span id="hud-time">0:00</span></span>
      <span class="hud-item">&#11088; <span id="hud-score">0</span></span>
      <span class="hud-item">&#128218; <span id="hud-facts">0</span>/<span id="hud-facts-total">0</span></span>
    </div>
  </div>

  <!-- Mobile Controls -->
  <div id="mobile-controls">
    <div class="ctrl-row">
      <div class="ctrl-left-group">
        <button class="ctrl-btn" id="btn-left">&#9664;</button>
        <button class="ctrl-btn" id="btn-right">&#9654;</button>
      </div>
      <div class="ctrl-right-group">
        <button class="ctrl-btn" id="btn-jump">&#9650;</button>
      </div>
    </div>
  </div>

  <!-- Knowledge Popup -->
  <div id="knowledge-popup">
    <h3 id="kp-title">B-Corp Feit</h3>
    <p id="kp-text">Tekst hier...</p>
    <button onclick="closeKnowledge()">Begrepen! &#128077;</button>
  </div>

  <!-- Pause -->
  <div id="pause-overlay">
    <h2>Gepauzeerd</h2>
    <button class="start-btn" onclick="togglePause()">Verder Spelen</button>
    <button class="menu-btn" style="margin-top:12px;" onclick="quitToMenu()">Stoppen</button>
  </div>

  <!-- Level Complete -->
  <div id="level-complete">
    <h2 id="lc-title">Level Compleet!</h2>
    <div class="stars" id="lc-stars">&#11088;&#11088;&#11088;</div>
    <div id="lc-score-breakdown" style="color:rgba(255,255,255,0.85); font-size:0.85em; margin:8px 0 4px; line-height:1.7;"></div>
    <div class="summary" id="lc-summary"></div>
    <div class="btn-row">
      <button class="menu-btn" onclick="quitToMenu()">Menu</button>
      <button class="start-btn" id="lc-next" onclick="nextLevel()">Volgend Level &#9654;</button>
    </div>
  </div>

  <!-- High Score Screen -->
  <div id="highscore-screen" style="display:none; position:fixed; inset:0; z-index:200; background:rgba(10,22,40,0.95); flex-direction:column; align-items:center; justify-content:center; padding:20px;">
    <div style="background:linear-gradient(135deg,#1a2a4a,#0d1b30); border-radius:18px; padding:28px 24px; max-width:400px; width:90%; text-align:center; border:2px solid rgba(232,119,34,0.4); box-shadow:0 8px 32px rgba(0,0,0,0.5);">
      <h2 style="color:#e87722; margin-bottom:4px; font-size:1.5em;">&#127942; Uitgespeeld!</h2>
      <p style="color:rgba(255,255,255,0.7); margin-bottom:16px; font-size:0.85em;">Voer je naam in voor de Hall of Fame</p>
      <div id="hs-input-area">
        <input type="text" id="hs-name" maxlength="20" placeholder="Jouw naam..." style="width:80%; padding:10px 14px; border-radius:10px; border:2px solid #e87722; background:#0d1b30; color:#fff; font-size:1em; text-align:center; outline:none; margin-bottom:12px;">
        <div id="hs-total-score" style="color:#f5a030; font-size:1.1em; margin-bottom:12px;"></div>
        <button class="start-btn" id="hs-submit-btn" onclick="submitHighScore()" style="margin-bottom:10px;">Opslaan &#128190;</button>
      </div>
      <div id="hs-list-area" style="display:none;">
        <h3 style="color:#e87722; margin-bottom:10px;">&#127942; Hall of Fame</h3>
        <div id="hs-list" style="max-height:250px; overflow-y:auto; margin-bottom:14px;"></div>
      </div>
      <button class="menu-btn" onclick="closeHighScore()">Terug naar Menu</button>
    </div>
  </div>

  <!-- Level Intro -->
  <div id="level-intro">
    <div class="intro-icon" id="intro-icon"></div>
    <h2 id="intro-title"></h2>
    <p class="intro-desc" id="intro-desc"></p>
    <button class="start-btn" onclick="startLevelFromIntro()">Start! &#127918;</button>
  </div>
</div>

<script>
// ========================
// GAME CONFIG & STATE
// ========================
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

const GRAVITY = 0.5;
const JUMP_FORCE = -13;
const MOVE_SPEED = 4.5;
const TILE = 40;

let W, H;
let gameState = 'menu'; // menu, playing, paused, knowledge, levelcomplete, intro
let currentLevel = 0;
let score = 0;
let factsCollected = 0;
let levelStartTime = 0;
let levelElapsed = 0;
let pausedTimeAccum = 0;
let pauseStartedAt = 0;
let cameraX = 0;
let animFrame = 0;
let particles = [];
let unlockedLevels = [true, false, false, false];
let levelStars = [0, 0, 0, 0];
let levelScores = [0, 0, 0, 0];
let selectedChar = ''; // 'man', 'vrouw', 'driessen'
let gameCompleted = false;

// Try to load progress
try {
  const saved = JSON.parse(localStorage.getItem('bcorp_progress'));
  if (saved) {
    unlockedLevels = saved.unlocked || unlockedLevels;
    levelStars = saved.stars || levelStars;
    levelScores = saved.scores || levelScores;
    selectedChar = saved.character || '';
    gameCompleted = saved.gameCompleted || false;
    if (!gameCompleted && levelStars.every(s => s > 0)) gameCompleted = true;
  }
} catch(e) {}

function saveProgress() {
  try {
    localStorage.setItem('bcorp_progress', JSON.stringify({
      unlocked: unlockedLevels,
      stars: levelStars,
      scores: levelScores,
      character: selectedChar,
      gameCompleted: gameCompleted
    }));
  } catch(e) {}
}

// Player
const player = {
  x: 80, y: 200,
  vx: 0, vy: 0,
  w: 30, h: 36,
  onGround: false,
  facing: 1,
  walkFrame: 0,
  alive: true
};

// Input
const keys = { left: false, right: false, jump: false };
let jumpPressed = false;

// ========================
// LEVEL DATA
// ========================
const LEVELS = [
  {
    name: "De Waarde van Werk",
    subtitle: "Social",
    icon: "&#129309;",
    theme: "city",
    color1: "#e87722",
    color2: "#ff9d4d",
    bgColor1: "#1a0a2e",
    bgColor2: "#2d1b4e",
    introText: "Bij Driessen Groep geloven we dat werk waardevol is voor iedereen. We maken impact bij onze klanten, in de maatschappij en voor de mensen die we aan werk helpen. Ontdek wat de waarde van werk echt betekent!",
    completeSummary: "Je hebt geleerd over de sociale impact van Driessen Groep! Via onze klanten helpen we duizenden mensen aan waardevol werk. Met onze maatschappelijke initiatieven maken we ook daarbuiten het verschil. Dat is de kracht van werk!",
    platforms: [
      {x:0,y:10,w:8,h:2},
      {x:10,y:9,w:4,h:2},
      {x:16,y:8,w:5,h:2},
      {x:15,y:11,w:3,h:1},
      {x:23,y:9,w:4,h:2},
      {x:22,y:11,w:3,h:1},
      {x:29,y:7,w:4,h:2},
      {x:35,y:9,w:5,h:2},
      {x:42,y:8,w:4,h:2},
      {x:41,y:11,w:3,h:1},
      {x:48,y:10,w:5,h:2},
      {x:55,y:8,w:4,h:2},
      {x:54,y:11,w:3,h:1},
      {x:61,y:9,w:4,h:2},
      {x:67,y:7,w:5,h:2},
      {x:74,y:9,w:4,h:2},
      {x:73,y:11,w:3,h:1},
      {x:80,y:10,w:8,h:2},
      {x:0,y:14,w:90,h:2}
    ],
    collectibles: [
      {x:12,y:7,type:'fact',icon:'&#129309;',title:'Impact bij Klanten',text:'Via onze opdrachtgevers helpen we jaarlijks duizenden mensen aan werk. Elke match die we maken heeft impact: op de kandidaat, op het bedrijf, en op de maatschappij.'},
      {x:18,y:6,type:'coin'},
      {x:24,y:7,type:'coin'},
      {x:16,y:10,type:'fact',icon:'&#128105;&#8205;&#128188;',title:'Inclusief Werkgeverschap',text:'Driessen Groep gelooft dat iedereen recht heeft op waardevol werk. We helpen ook mensen met een afstand tot de arbeidsmarkt aan een baan, en adviseren klanten over inclusief werkgeverschap.'},
      {x:31,y:5,type:'coin'},
      {x:37,y:7,type:'coin'},
      {x:42,y:10,type:'fact',icon:'&#127793;',title:'Maatschappelijke Initiatieven',text:'Driessen Groep zet zich actief in voor de maatschappij. Van lokale sponsoring tot landelijke initiatieven die mensen kansen bieden. We geloven dat je als bedrijf verder moet kijken dan je eigen muren.'},
      {x:50,y:8,type:'coin'},
      {x:55,y:10,type:'fact',icon:'&#10084;&#65039;',title:'Welzijn & Groei',text:'Als B-Corp meet Driessen Groep het welzijn van medewerkers. Werk biedt niet alleen inkomen, maar ook waardigheid, structuur en persoonlijke groei. Blije medewerkers maken meer impact!'},
      {x:62,y:7,type:'coin'},
      {x:68,y:5,type:'coin'},
      {x:75,y:7,type:'coin'},
      {x:75,y:7,type:'fact',icon:'&#128170;',title:'De Kracht van Werk',text:'Door mensen te verbinden met werk creëren we een positieve impact die verder gaat dan de werkplek. Dat voelen onze klanten, hun medewerkers, en de hele gemeenschap.'},
      {x:83,y:8,type:'coin'}
    ],

// AUDIO SYSTEM (Web Audio API)
// ========================
let audioCtx = null;
let musicGain = null;
let sfxGain = null;
let musicPlaying = false;
let musicOscillators = [];

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // Master gains
    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0.12;
    musicGain.connect(audioCtx.destination);
    sfxGain = audioCtx.createGain();
    sfxGain.gain.value = 0.25;
    sfxGain.connect(audioCtx.destination);
  } catch(e) {}
}

// Ensure audio starts on first user interaction
function ensureAudio() {
  if (!audioCtx) initAudio();
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}
document.addEventListener('click', ensureAudio, { once: false });
document.addEventListener('touchstart', ensureAudio, { once: false });
document.addEventListener('keydown', ensureAudio, { once: false });

function playTone(freq, duration, type, gainNode, volume, detune) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  if (detune) osc.detune.value = detune;
  g.gain.value = volume || 0.3;
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(g);
  g.connect(gainNode || sfxGain);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function sfxJump() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(250, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.12);
  g.gain.setValueAtTime(0.2, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
  osc.connect(g);
  g.connect(sfxGain);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.15);
}

function sfxCoin() {
  if (!audioCtx) return;
  playTone(988, 0.08, 'square', sfxGain, 0.2);
  setTimeout(() => playTone(1319, 0.12, 'square', sfxGain, 0.2), 60);
}

function sfxFact() {
  if (!audioCtx) return;
  const notes = [523, 659, 784, 1047];
  notes.forEach((n, i) => {
    setTimeout(() => playTone(n, 0.15, 'triangle', sfxGain, 0.2), i * 80);
  });
}

function sfxDeath() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(400, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.4);
  g.gain.setValueAtTime(0.2, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
  osc.connect(g);
  g.connect(sfxGain);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.5);
}

function sfxLevelComplete() {
  if (!audioCtx) return;
  const notes = [523, 659, 784, 659, 784, 1047];
  notes.forEach((n, i) => {
    setTimeout(() => playTone(n, 0.2, 'triangle', sfxGain, 0.25), i * 120);
  });
}

// Per-level background music - each level has a unique feel
let musicInterval = null;
let musicInterval2 = null;
function startMusic() {
  if (!audioCtx || musicPlaying) return;
  musicPlaying = true;

  const levelMusic = [
    { // Level 1: Social/Work - warm, upbeat major key
      scale: [262, 294, 330, 349, 392, 440, 494, 523],
      melody: [0,2,4,5,4,2,3,5,7,5,4,2,0,2,4,3],
      bass: [0,0,4,4,3,3,5,5],
      tempo: 320,
      wave: 'triangle',
      bassWave: 'sine',
      vol: 0.15,
      bassVol: 0.10
    },
    { // Level 2: Green/Nature - pentatonic, gentle, nature sounds
      scale: [196, 220, 262, 294, 330, 392, 440, 523],
      melody: [2,4,5,7,5,4,2,0,2,4,7,5,4,2,0,2],
      bass: [0,0,2,2,4,4,2,2],
      tempo: 480,
      wave: 'sine',
      bassWave: 'sine',
      vol: 0.12,
      bassVol: 0.08
    },
    { // Level 3: Governance - structured, minor key, march-like
      scale: [220, 247, 262, 294, 330, 349, 415, 440],
      melody: [0,2,4,6,4,2,0,3,5,7,5,3,0,4,2,0],
      bass: [0,0,0,4,4,4,3,3],
      tempo: 380,
      wave: 'square',
      bassWave: 'triangle',
      vol: 0.08,
      bassVol: 0.06
    },
    { // Level 4: Community - triumphant, bright, celebratory
      scale: [294, 330, 370, 392, 440, 494, 554, 587],
      melody: [0,2,4,7,5,7,4,2,0,4,7,5,2,4,5,7],
      bass: [0,0,4,4,2,2,5,5],
      tempo: 280,
      wave: 'triangle',
      bassWave: 'sine',
      vol: 0.14,
      bassVol: 0.10
    }
  ];

  const lm = levelMusic[currentLevel % levelMusic.length];
  let step = 0;
  let bassStep = 0;

  function playMelodyNote() {
    if (!musicPlaying || !audioCtx) return;
    const noteIdx = lm.melody[step % lm.melody.length];
    const freq = lm.scale[noteIdx % lm.scale.length];
    playTone(freq * 2, lm.tempo / 1000 * 0.8, lm.wave, musicGain, lm.vol);
    // Harmony note (third above, softer)
    if (step % 4 === 0) {
      const harmIdx = (noteIdx + 2) % lm.scale.length;
      playTone(lm.scale[harmIdx] * 2, lm.tempo / 1000 * 1.5, 'sine', musicGain, lm.vol * 0.4);
    }
    step++;
  }

  function playBassNote() {
    if (!musicPlaying || !audioCtx) return;
    const noteIdx = lm.bass[bassStep % lm.bass.length];
    const freq = lm.scale[noteIdx % lm.scale.length];
    playTone(freq * 0.5, lm.tempo / 1000 * 1.8, lm.bassWave, musicGain, lm.bassVol);
    bassStep++;
  }

  playMelodyNote();
  playBassNote();
  musicInterval = setInterval(playMelodyNote, lm.tempo);
  musicInterval2 = setInterval(playBassNote, lm.tempo * 2);
}

function stopMusic() {
  musicPlaying = false;
  if (musicInterval) { clearInterval(musicInterval); musicInterval = null; }
  if (musicInterval2) { clearInterval(musicInterval2); musicInterval2 = null; }
}

    const completed = levelStars[i] > 0;
    const locked = !unlockedLevels[i];
    card.className = 'level-card' + (locked ? ' locked' : completed ? ' completed' : '');
    const stars = levelStars[i];
    const starStr = '&#11088;'.repeat(stars) + '&#9734;'.repeat(3 - stars);
    card.innerHTML = `
      <div class="level-icon">${lv.icon}</div>
      <div class="level-name">${lv.name}</div>
      <div class="level-sub">${lv.subtitle}</div>
      <div class="level-stars">${locked ? '&#128274;' : completed ? starStr + ' &#10003;' : starStr}</div>
    `;
    if (unlockedLevels[i] && !completed) {
      card.onclick = () => showLevelIntro(i);
    }
    grid.appendChild(card);
  });
}

function showLevelIntro(idx) {
  currentLevel = idx;
  const lv = LEVELS[idx];
  document.getElementById('level-screen').classList.add('hidden');
  document.getElementById('level-intro').style.display = 'flex';
  document.getElementById('intro-icon').innerHTML = lv.icon;
  document.getElementById('intro-title').textContent = `Level ${idx + 1}: ${lv.name}`;
  document.getElementById('intro-desc').textContent = lv.introText;
  gameState = 'intro';
}

function startLevelFromIntro() {
  document.getElementById('level-intro').style.display = 'none';
  startLevel(currentLevel);
}

function startLevel(idx) {
  currentLevel = idx;
  const lv = LEVELS[idx];

  // Reset player
  player.x = 80;
  player.y = lv.platforms[0].y * TILE - player.h - 4;
  player.vx = 0;
  player.vy = 0;
  player.onGround = false;
  player.alive = true;
  player.facing = 1;

  // Build level data
  levelPlatforms = lv.platforms.map(p => ({
    x: p.x * TILE, y: p.y * TILE,
    w: p.w * TILE, h: p.h * TILE
  }));
  levelCollectibles = lv.collectibles.map((c, ci) => {
    let cy = c.y;
    // Push collectibles out of platforms if overlapping
    for (const p of lv.platforms) {
      if (c.x + 0.5 > p.x && c.x + 0.5 < p.x + p.w && cy + 0.5 > p.y && cy + 0.5 < p.y + p.h) {
        cy = p.y - 1;
      }
    }
    return { x: c.x * TILE + TILE/2, y: cy * TILE + TILE/2,
      type: c.type, icon: c.icon || '',
      title: c.title || '', text: c.text || '',
      collected: false, id: ci };
  });
  levelHazards = lv.hazards.map(h => ({
    x: h.x * TILE, y: h.y * TILE,
    w: h.w * TILE, h: TILE,
    type: h.type
  }));
  levelFinish = { x: lv.finish.x * TILE, y: lv.finish.y * TILE };

  totalFacts = levelCollectibles.filter(c => c.type === 'fact').length;
  factsCollected = 0;
  score = 0;
  levelStartTime = Date.now();
  pausedTimeAccum = 0;
  collectedSet.clear();
  cameraX = 0;
  particles = [];

  // UI
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('hud-level').textContent = `Level ${idx + 1}`;
  updateHUD();

  const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  document.getElementById('mobile-controls').style.display = isMobile ? 'block' : 'none';

  deathTimer = 0;
  gameState = 'playing';
  ensureAudio();
  stopMusic();
  startMusic();
}

function getLevelElapsed() {
  if (gameState === 'paused') return (pauseStartedAt - levelStartTime - pausedTimeAccum) / 1000;
  return (Date.now() - levelStartTime - pausedTimeAccum) / 1000;
}

function formatTime(secs) {
  const m = Math.floor(secs / 60);
  const s = Math.floor(secs % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function updateHUD() {
  document.getElementById('hud-score').textContent = score;
  document.getElementById('hud-facts').textContent = factsCollected;
  document.getElementById('hud-facts-total').textContent = totalFacts;
  document.getElementById('hud-time').textContent = formatTime(getLevelElapsed());
}

function togglePause() {
  if (gameState === 'playing') {
    gameState = 'paused';
    pauseStartedAt = Date.now();
    document.getElementById('pause-overlay').style.display = 'flex';
  } else if (gameState === 'paused') {
    gameState = 'playing';
    pausedTimeAccum += Date.now() - pauseStartedAt;
    document.getElementById('pause-overlay').style.display = 'none';
  }
}

function quitToMenu() {
  stopMusic();
  document.getElementById('pause-overlay').style.display = 'none';
  document.getElementById('level-complete').style.display = 'none';
  document.getElementById('hud').style.display = 'none';
  document.getElementById('mobile-controls').style.display = 'none';
  document.getElementById('char-screen').classList.add('hidden');

  document.getElementById('level-screen').classList.remove('hidden');

// Track total score across all levels
let totalGameScore = levelScores.reduce((a, b) => a + b, 0);

function showLevelComplete() {
  gameState = 'levelcomplete';
  const lv = LEVELS[currentLevel];
  const factRatio = totalFacts > 0 ? factsCollected / totalFacts : 0;
  let stars = 1;
  if (factRatio >= 0.6) stars = 2;
  if (factRatio >= 1.0) stars = 3;

  // Calculate time bonus: max 100 points, decreasing over time
  // Full bonus under 30s, zero bonus after 180s
  levelElapsed = getLevelElapsed();
  const timeBonus = Math.max(0, Math.round(100 * (1 - (levelElapsed - 30) / 150)));
  score += timeBonus;

  if (stars > levelStars[currentLevel]) levelStars[currentLevel] = stars;
  if (currentLevel + 1 < LEVELS.length) unlockedLevels[currentLevel + 1] = true;
  levelScores[currentLevel] = score;
  totalGameScore = levelScores.reduce((a, b) => a + b, 0);
  saveProgress();

  const starStr = '&#11088;'.repeat(stars) + '&#9734;'.repeat(3 - stars);
  const isLastLevel = currentLevel === LEVELS.length - 1;
  document.getElementById('lc-title').textContent = isLastLevel ? 'Alle Levels Voltooid!' : 'Level Compleet!';
  document.getElementById('lc-stars').innerHTML = starStr;

  // Score breakdown
  const collectScore = score - timeBonus;
  document.getElementById('lc-score-breakdown').innerHTML =
    '&#128176; Verzameld: ' + collectScore + ' pt &nbsp;|&nbsp; &#9200; Tijd (' + formatTime(levelElapsed) + '): +' + timeBonus + ' pt &nbsp;|&nbsp; <b>Totaal: ' + score + ' pt</b>';

  document.getElementById('lc-summary').textContent = lv.completeSummary;

  const nextBtn = document.getElementById('lc-next');
  if (isLastLevel) {
    // Show high score button instead of next level
    nextBtn.style.display = 'inline-block';
    nextBtn.textContent = '🏆 Hall of Fame';
    nextBtn.onclick = function() {
      document.getElementById('level-complete').style.display = 'none';
      showHighScoreInput();
    };
  } else {
    nextBtn.style.display = 'inline-block';
    nextBtn.textContent = 'Volgend Level ▶';
    nextBtn.onclick = function() { nextLevel(); };
  }

  document.getElementById('level-complete').style.display = 'flex';
}

function nextLevel() {
  document.getElementById('level-complete').style.display = 'none';
  if (currentLevel < LEVELS.length - 1) {
    showLevelIntro(currentLevel + 1);
  }
}

// === HIGH SCORE SYSTEM (Server API + localStorage fallback) ===
const HS_API = '/api/highscores';

async function fetchHighScores() {
  try {
    const res = await fetch(HS_API);
    if (res.ok) return await res.json();
  } catch(e) {}
  try { return JSON.parse(localStorage.getItem('bcorp_highscores')) || []; } catch(e) { return []; }
}

async function postHighScore(entry) {
  try {
    const res = await fetch(HS_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(entry)
    });
    if (res.ok) {
      const data = await res.json();
      // Also cache locally
      try { localStorage.setItem('bcorp_highscores', JSON.stringify(data.scores)); } catch(e) {}
      return data.scores || [];
    }
  } catch(e) {}
  // Fallback: save locally
  try {
    const scores = JSON.parse(localStorage.getItem('bcorp_highscores')) || [];
    scores.push(entry);
    scores.sort((a, b) => b.stars - a.stars || b.score - a.score);
    localStorage.setItem('bcorp_highscores', JSON.stringify(scores));
    return scores;
  } catch(e) { return [entry]; }
}

function showHighScoreInput() {
  const screen = document.getElementById('highscore-screen');
  screen.style.display = 'flex';

  if (gameCompleted) {
    document.getElementById('hs-input-area').style.display = 'none';
    document.getElementById('hs-list-area').style.display = 'block';
    fetchHighScores().then(scores => renderHighScoreList(scores, null));
    return;
  }

  document.getElementById('hs-input-area').style.display = 'block';
  document.getElementById('hs-list-area').style.display = 'none';

  const totalStars = levelStars.reduce((a, b) => a + b, 0);
  document.getElementById('hs-total-score').innerHTML =
    '&#11088; ' + totalStars + '/12 sterren &nbsp;&bull;&nbsp; ' + totalGameScore + ' punten';

  const nameInput = document.getElementById('hs-name');
  nameInput.value = '';
  const submitBtn = document.getElementById('hs-submit-btn');
  submitBtn.disabled = false;
  submitBtn.textContent = 'Opslaan \u{1f4be}';
  setTimeout(() => nameInput.focus(), 100);
}

async function submitHighScore() {
  const submitBtn = document.getElementById('hs-submit-btn');
  if (submitBtn.disabled) return;

  const name = document.getElementById('hs-name').value.trim();
  if (!name) {
    document.getElementById('hs-name').style.borderColor = '#ff4444';
    setTimeout(() => document.getElementById('hs-name').style.borderColor = '#e87722', 1000);
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Opslaan...';

  const totalStars = levelStars.reduce((a, b) => a + b, 0);
  const newEntry = {
    name: name,
    score: totalGameScore,
    stars: totalStars,
    character: selectedChar,
    date: new Date().toLocaleDateString('nl-NL')
  };

  const scores = await postHighScore(newEntry);

  gameCompleted = true;
  saveProgress();

  submitBtn.textContent = '✅ Opgeslagen!';
  setTimeout(() => {
    document.getElementById('hs-input-area').style.display = 'none';
    document.getElementById('hs-list-area').style.display = 'block';
    renderHighScoreList(scores, name);
  }, 1200);
}

function renderHighScoreList(scores, highlightName) {
  const list = document.getElementById('hs-list');

  if (!scores || scores.length === 0) {
    list.innerHTML = '<p style="color:rgba(255,255,255,0.5); padding:20px;">Nog geen scores!</p>';
    return;
  }

  const charEmoji = { man: '\u{1f468}', vrouw: '\u{1f469}', driessen: '\u{1f98a}' };
  list.innerHTML = scores.map((s, i) => {
    const isNew = highlightName && s.name === highlightName;
    const rankIcon = i === 0 ? '\u{1f947}' : i === 1 ? '\u{1f948}' : i === 2 ? '\u{1f949}' : (i + 1);
    return `<div class="hs-entry${isNew ? ' hs-new' : ''}">
      <span class="hs-rank">${rankIcon}</span>
      <span class="hs-name">${charEmoji[s.character] || '\u{1f464}'} ${s.name}</span>
      <span class="hs-score">${'\u2b50'.repeat(s.stars)} ${s.score}pt</span>
    </div>`;
  }).join('');
}

function closeHighScore() {
  document.getElementById('highscore-screen').style.display = 'none';
  showStart();
}

async function viewHighScores() {
  const screen = document.getElementById('highscore-screen');
  screen.style.display = 'flex';
  document.getElementById('hs-input-area').style.display = 'none';
  document.getElementById('hs-list-area').style.display = 'block';
  const scores = await fetchHighScores();
  renderHighScoreList(scores, null);
}

// Mobile controls
function setupMobileBtn(id, key) {
  const btn = document.getElementById(id);
  const start = (e) => { e.preventDefault(); keys[key] = true; btn.classList.add('active'); };
  const end = (e) => { e.preventDefault(); keys[key] = false; btn.classList.remove('active'); if(key==='jump') jumpPressed = false; };
  btn.addEventListener('touchstart', start, {passive: false});
